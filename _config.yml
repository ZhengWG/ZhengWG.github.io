# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Only if your site type is GitHub Project sites and doesn't have a custom domain,
# change below value to '/projectname'.
baseurl: ''

# the HTML language tag › https://www.w3.org/International/questions/qa-choosing-language-tags
lang: zh-Hans

# Change to your timezone › http://www.timezoneconverter.com/cgi-bin/findzone/findzone
timezone: Asia/Shanghai

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# --------------------------
title: Johney Zheng                          # the main title

tagline: Johney Zheng的小站   # it will display as the sub-title

description: 不要习惯了黑暗就为黑暗辩护；不要为了自己的苟且而得意，做一个勇敢而热情的人                        # used by seo meta and the atom feed

# Must match the CNAME file (apex domain, no `www`), otherwise jekyll-seo-tag
# emits canonical URLs, the sitemap and the feed for a host the site is not
# served on, and the PWA's same-origin cache allowlist misses.
url: 'https://johneyzheng.top'

github:
  username: ZhengWG             # change to your github username

# twitter:
  # username: twitter_username            # change to your twitter username

social:
  # Change to your full name.
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: Johney Zheng
  email: 21625111@zju.edu.cn             # change to your email address
  links:
    # The first element serves as the copyright owner's link
    - https://github.com/ZhengWG
    # Uncomment below to add more social links
    # - https://www.facebook.com/username
    # - https://www.linkedin.com/in/username

# Leave empty unless you actually have a Search Console token; the previous
# value was the literal placeholder and emitted a bogus verification meta tag.
google_site_verification:
# --------------------------

google_analytics:
  # This must be the GA4 *Measurement ID*: `G-` followed by 10 alphanumeric
  # characters, found under 管理 → 数据流 → 网站 → 衡量ID.
  #
  # The previous value, 'G-364499169', was `G-` plus 9 digits. That is the shape
  # of a GA4 *Property ID* (管理 → 媒体资源设置 → 媒体资源ID), which is a
  # different identifier. gtag.js accepts any string without complaining and
  # silently sends hits nowhere, which is why this failed quietly.
  # To disable, leave the value absent -- not ''. Liquid treats an empty string
  # as truthy, so `id: ''` still emits a gtag script with an empty id.
  id: 'G-M5XCEMPBT7'                 # GA4 Measurement ID


# Prefer color scheme setting.
#
# Note: Keep empty will follow the system prefer color by default,
# and there will be a toggle to switch the theme between dark and light
# on the bottom left of the sidebar.
#
# Available options:
#
#     light  - Use the light color scheme
#     dark   - Use the dark color scheme
#
theme_mode:  # [light|dark]

# The CDN endpoint for images.
# Notice that once it is assigned, the CDN url
# will be added to all image (site avatar & posts' images) paths starting with '/'
#
# e.g. 'https://cdn.com'
img_cdn: ''

# the avatar on sidebar, support local or CORS resources
avatar: /assets/img/avatar.jpg

# boolean type, the global switch for ToC in posts.
toc: true

# Comments are handled by Valine below. The Disqus integration that shipped
# with the theme was disabled and unused, and has been removed.
valine_comment:
  enable: true
  # app_id
  leancloud_appid: IJm2s0GdkzhEOLwVfClrHeWs-gzGzoHsz
  # app_key
  leancloud_appkey: Y281bajarkkIGs8p4WmrTkNi
  # placeholder
  placeholder: "请在下面评论："

paginate: 10

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:   # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order


defaults:
  -
    scope:
      path: ''          # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true    # Enable comments in posts.
      toc: true         # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  -
    scope:
      path: _drafts
    values:
      comments: false
  -
    scope:
      path: ''
      type: tabs             # see `site.collections`
    values:
      layout: page
      permalink: /:title/
      dynamic_title: true    # Hide title in mobile screens.

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - '*.gem'
  - '*.gemspec'
  - tools
  - docs
  - README.md
  - LICENSE
  - gulpfile.js
  - node_modules
  - '*.json'

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
