<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img"><title>AllReduce latency: startup cost versus useful transfer</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#52657b" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="42" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#172b45" text-anchor="start" font-weight="700">AllReduce latency: startup cost versus useful transfer</text><text x="36" y="80" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#52657b" text-anchor="start">P = 4; orange = startup α; blue = transfer; transfer share = bandwidth utilization</text><text x="36" y="130" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#172b45" text-anchor="start" font-weight="700">Small message: S = 1 MB, α = 2 µs dominates</text><text x="36" y="187" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="start" font-weight="700">Ring</text><text x="36" y="210" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#52657b" text-anchor="start">6 steps × S/4</text><rect x="270" y="166" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="342" y="166" width="25.800000000000004" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="367.8" y="166" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="439.8" y="166" width="25.800000000000004" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="465.6" y="166" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="537.6" y="166" width="25.800000000000004" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="563.4" y="166" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="635.4" y="166" width="25.800000000000004" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="661.1999999999999" y="166" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="733.1999999999999" y="166" width="25.800000000000004" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="758.9999999999999" y="166" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="830.9999999999999" y="166" width="25.800000000000004" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><text x="868.7999999999998" y="188" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">16.3 µs · 26%</text><text x="36" y="249" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="start" font-weight="700">HD</text><text x="36" y="272" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#52657b" text-anchor="start">4 steps: halve, then double</text><rect x="270" y="228" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="342" y="228" width="38.7" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="380.7" y="228" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="452.7" y="228" width="38.7" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="491.4" y="228" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="563.4" y="228" width="38.7" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="602.1" y="228" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="674.1" y="228" width="38.7" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><text x="724.8000000000001" y="250" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">12.3 µs · 35%</text><text x="36" y="311" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="start" font-weight="700">Two-shot</text><text x="36" y="334" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#52657b" text-anchor="start">2 steps × 3S/4</text><rect x="270" y="290" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="342" y="290" width="77.4" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="419.4" y="290" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="491.4" y="290" width="77.4" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><text x="580.8" y="312" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">8.3 µs · 52%</text><text x="36" y="373" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="start" font-weight="700">One-shot</text><text x="36" y="396" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#52657b" text-anchor="start">1 step × 3S (2× bytes)</text><rect x="270" y="352" width="72" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="342" y="352" width="309.59999999999997" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><text x="663.5999999999999" y="374" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">10.6 µs · 81%</text><text x="36" y="465" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#52657b" text-anchor="start">Fewer rounds win. High utilization alone does not imply minimum latency.</text><line x1="36" y1="492" x2="1164" y2="492" stroke="#d5dfe9" stroke-width="2"/><text x="36" y="545" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#172b45" text-anchor="start" font-weight="700">Large message: S = 64 MB; transfer dominates</text><text x="36" y="602" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="start" font-weight="700">Ring</text><text x="36" y="625" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#52657b" text-anchor="start">6 × 16 MB</text><rect x="270" y="581" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="272.7" y="581" width="61.65" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="334.34999999999997" y="581" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="337.04999999999995" y="581" width="61.65" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="398.69999999999993" y="581" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="401.3999999999999" y="581" width="61.65" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="463.0499999999999" y="581" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="465.7499999999999" y="581" width="61.65" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="527.3999999999999" y="581" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="530.0999999999999" y="581" width="61.65" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="591.7499999999999" y="581" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="594.4499999999999" y="581" width="61.65" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><text x="668.0999999999999" y="603" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">286 µs · 96%</text><text x="36" y="664" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="start" font-weight="700">HD</text><text x="36" y="687" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#52657b" text-anchor="start">32 + 16 + 16 + 32 MB</text><rect x="270" y="643" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="272.7" y="643" width="92.47500000000001" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="365.175" y="643" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="367.875" y="643" width="92.47500000000001" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="460.35" y="643" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="463.05" y="643" width="92.47500000000001" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="555.525" y="643" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="558.225" y="643" width="92.47500000000001" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><text x="662.7" y="665" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">282 µs · 97%</text><text x="36" y="726" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="start" font-weight="700">Two-shot</text><text x="36" y="749" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#52657b" text-anchor="start">2 × 48 MB</text><rect x="270" y="705" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="272.7" y="705" width="184.95000000000002" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><rect x="457.65" y="705" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="460.34999999999997" y="705" width="184.95000000000002" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><text x="657.3" y="727" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">278 µs · 99%</text><text x="36" y="788" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="start" font-weight="700">One-shot</text><text x="36" y="811" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#52657b" text-anchor="start">1 × 192 MB</text><rect x="270" y="767" width="2.7" height="30" rx="0" fill="#c75a24" stroke="#c75a24"/><rect x="272.7" y="767" width="741.1500000000001" height="30" rx="0" fill="#246bc5" stroke="#246bc5"/><text x="1025.8500000000001" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">551 µs · 99.6%</text><text x="36" y="885" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#52657b" text-anchor="start">Ring, HD, and two-shot each transfer 1.5S: their totals differ by less than 3%.</text><text x="36" y="920" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#52657b" text-anchor="start">One-shot transfers twice as many bytes: nearly full utilization, but nearly 2× the latency.</text><text x="36" y="962" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start" font-weight="700">Compare total bar length (latency), not just the fraction occupied by blue transfer segments.</text></svg>