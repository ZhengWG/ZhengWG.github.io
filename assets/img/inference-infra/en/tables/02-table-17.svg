<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="506" viewBox="0 0 1600 506"><rect width="1600" height="506" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="485" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Combination</text><rect x="485" y="1" width="402" height="68" fill="none" stroke="#ced7e4"/><text x="503" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Status</text><rect x="887" y="1" width="713" height="68" fill="none" stroke="#ced7e4"/><text x="905" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Reason</text><rect x="0" y="69" width="1600" height="100" fill="#ffffff"/><rect x="0" y="69" width="485" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">PP + hierarchical KV cache</text><rect x="485" y="69" width="402" height="100" fill="none" stroke="#ced7e4"/><text x="503" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Supported</text><rect x="887" y="69" width="713" height="100" fill="none" stroke="#ced7e4"/><text x="905" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">PP0 counts DMA acknowledgments and broadcasts along</text><text x="905" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the pipeline; CI covers MHA-style models</text><rect x="0" y="169" width="1600" height="68" fill="#f7f9fc"/><rect x="0" y="169" width="485" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">PP + speculative decoding</text><rect x="485" y="169" width="402" height="68" fill="none" stroke="#ced7e4"/><text x="503" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Rejected at startup</text><rect x="887" y="169" width="713" height="68" fill="none" stroke="#ced7e4"/><text x="905" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">causal inversion; see below</text><rect x="0" y="237" width="1600" height="100" fill="#ffffff"/><rect x="0" y="237" width="485" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">PP + DSA layer splitting</text><rect x="485" y="237" width="402" height="100" fill="none" stroke="#ced7e4"/><text x="503" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Rejected at startup</text><rect x="887" y="237" width="713" height="100" fill="none" stroke="#ced7e4"/><text x="905" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">layer splitting depends on prefill CP, and CP+PP is</text><text x="905" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">unverified</text><rect x="0" y="337" width="1600" height="68" fill="#f7f9fc"/><rect x="0" y="337" width="485" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="379" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">L3 cache + DCP</text><rect x="485" y="337" width="402" height="68" fill="none" stroke="#ced7e4"/><text x="503" y="379" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Rejected at startup</text><rect x="887" y="337" width="713" height="68" fill="none" stroke="#ced7e4"/><text x="905" y="379" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the L3 key does not include the shard rank</text><rect x="0" y="405" width="1600" height="100" fill="#ffffff"/><rect x="0" y="405" width="485" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="447" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">PP for PD disaggregation</text><rect x="485" y="405" width="402" height="100" fill="none" stroke="#ced7e4"/><text x="503" y="447" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Restricted</text><rect x="887" y="405" width="713" height="100" fill="none" stroke="#ced7e4"/><text x="905" y="447" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the decode-side pp_size must equal the prefill</text><text x="905" y="479" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">side&#x27;s, or be 1</text></svg>