<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="402" viewBox="0 0 1600 402"><rect width="1600" height="402" fill="#ffffff"/><rect x="0" y="1" width="1600" height="100" fill="#eaf0f9"/><rect x="0" y="1" width="310" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49"></text><rect x="310" y="1" width="422" height="100" fill="none" stroke="#ced7e4"/><text x="328" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Communication within each</text><text x="328" y="75" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">layer</text><rect x="732" y="1" width="253" height="100" fill="none" stroke="#ced7e4"/><text x="750" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Head-count limit</text><rect x="985" y="1" width="245" height="100" fill="none" stroke="#ced7e4"/><text x="1003" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Activations/GPU</text><rect x="1230" y="1" width="370" height="100" fill="none" stroke="#ced7e4"/><text x="1248" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Communication per GPU</text><rect x="0" y="101" width="1600" height="100" fill="#ffffff"/><rect x="0" y="101" width="310" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Ring (Pass-KV)</text><rect x="310" y="101" width="422" height="100" fill="none" stroke="#ced7e4"/><text x="328" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">block by block around a ring,</text><text x="328" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">N−1 iterative steps</text><rect x="732" y="101" width="253" height="100" fill="none" stroke="#ced7e4"/><text x="750" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">None</text><rect x="985" y="101" width="245" height="100" fill="none" stroke="#ced7e4"/><text x="1003" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">T·d/N</text><rect x="1230" y="101" width="370" height="100" fill="none" stroke="#ced7e4"/><text x="1248" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">2c · T · d , linear in T</text><rect x="0" y="201" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="201" width="310" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Ulysses (switch the</text><text x="18" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">split dimension)</text><rect x="310" y="201" width="422" height="100" fill="none" stroke="#ced7e4"/><text x="328" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">two all-to-alls</text><rect x="732" y="201" width="253" height="100" fill="none" stroke="#ced7e4"/><text x="750" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">N ≤ number of</text><text x="750" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">heads</text><rect x="985" y="201" width="245" height="100" fill="none" stroke="#ced7e4"/><text x="1003" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">T·d/N</text><rect x="1230" y="201" width="370" height="100" fill="none" stroke="#ced7e4"/><text x="1248" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">4c · T · d / N , 2/N of</text><text x="1248" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Ring</text><rect x="0" y="301" width="1600" height="100" fill="#ffffff"/><rect x="0" y="301" width="310" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Split + AllGather</text><rect x="310" y="301" width="422" height="100" fill="none" stroke="#ced7e4"/><text x="328" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">one gather between layers / at</text><text x="328" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the end</text><rect x="732" y="301" width="253" height="100" fill="none" stroke="#ced7e4"/><text x="750" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">None</text><rect x="985" y="301" width="245" height="100" fill="none" stroke="#ced7e4"/><text x="1003" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">T·d (no saving)</text><rect x="1230" y="301" width="370" height="100" fill="none" stroke="#ced7e4"/><text x="1248" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">on the order of c · T · d</text></svg>