<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470"><rect width="1600" height="470" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="381" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Parameter</text><rect x="381" y="1" width="841" height="68" fill="none" stroke="#ced7e4"/><text x="399" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">GPU-side modeling parameters and measured reference</text><rect x="1222" y="1" width="378" height="68" fill="none" stroke="#ced7e4"/><text x="1240" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">910B</text><rect x="0" y="69" width="1600" height="100" fill="#ffffff"/><rect x="0" y="69" width="381" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Intra-node busBW</text><rect x="381" y="69" width="841" height="100" fill="none" stroke="#ced7e4"/><text x="399" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">NVLink ~350-400 GB/s effective (measured AllReduce 128 MB busBW</text><text x="399" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">336 GB/s, P2P copy 395 GB/s)</text><rect x="1222" y="69" width="378" height="100" fill="none" stroke="#ced7e4"/><text x="1240" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">HCCS 56×7 = 392 GB/s</text><text x="1240" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(full-mesh)</text><rect x="0" y="169" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="169" width="381" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Inter-node busBW per GPU</text><rect x="381" y="169" width="841" height="100" fill="none" stroke="#ced7e4"/><text x="399" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">20 GB/s (4×400G NICs, 2 GPUs share 1 NIC; measured raw RDMA</text><text x="399" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">with NUMA binding 24.5, NCCL 8-pair cross-node P2P 15.1)</text><rect x="1222" y="169" width="378" height="100" fill="none" stroke="#ced7e4"/><text x="1240" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">25 GB/s (200G RoCE, 1:1)</text><rect x="0" y="269" width="1600" height="100" fill="#ffffff"/><rect x="0" y="269" width="381" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Intra-node α</text><rect x="381" y="269" width="841" height="100" fill="none" stroke="#ced7e4"/><text x="399" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">~2 μs (a single NVLink write; measured floor for one complete</text><text x="399" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">collective is ~10 μs with a custom kernel / ~20 μs with NCCL)</text><rect x="1222" y="269" width="378" height="100" fill="none" stroke="#ced7e4"/><text x="1240" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">~2 μs</text><rect x="0" y="369" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="369" width="381" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="411" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Inter-node α</text><rect x="381" y="369" width="841" height="100" fill="none" stroke="#ced7e4"/><text x="399" y="411" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">~15 μs (measured RDMA verbs one-way 9 μs; NCCL cross-node 64 KB</text><text x="399" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">AllReduce 74 μs)</text><rect x="1222" y="369" width="378" height="100" fill="none" stroke="#ced7e4"/><text x="1240" y="411" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">~20 μs</text></svg>