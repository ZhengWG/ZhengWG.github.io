<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><rect width="1600" height="950" fill="#ffffff"/><rect x="0" y="1" width="1600" height="100" fill="#eaf0f9"/><rect x="0" y="1" width="246" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Shape (example)</text><rect x="246" y="1" width="359" height="100" fill="none" stroke="#ced7e4"/><text x="264" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">What dominates traffic →</text><text x="264" y="75" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">approximate I</text><rect x="605" y="1" width="352" height="100" fill="none" stroke="#ced7e4"/><text x="623" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">P / saturation point</text><rect x="957" y="1" width="382" height="100" fill="none" stroke="#ced7e4"/><text x="975" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Does batching help?</text><rect x="1339" y="1" width="261" height="100" fill="none" stroke="#ced7e4"/><text x="1357" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Bottleneck</text><rect x="0" y="101" width="1600" height="196" fill="#ffffff"/><rect x="0" y="101" width="246" height="196" fill="none" stroke="#ced7e4"/><text x="18" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Square [4096,716</text><text x="18" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">8]×[7168,2048]</text><rect x="246" y="101" width="359" height="196" fill="none" stroke="#ced7e4"/><text x="264" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">All three terms are the</text><text x="264" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">same order of magnitude;</text><text x="264" y="207" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">none can be dropped I =</text><text x="264" y="239" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(2/3)·n/bpp , example</text><text x="264" y="271" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">≈2340</text><rect x="605" y="101" width="352" height="196" fill="none" stroke="#ced7e4"/><text x="623" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">P ≈ F (always</text><text x="623" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">saturated); saturation</text><text x="623" y="207" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">point long since passed</text><rect x="957" y="101" width="382" height="196" fill="none" stroke="#ced7e4"/><text x="975" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Doesn&#x27;t matter (already in</text><text x="975" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the compute region)</text><rect x="1339" y="101" width="261" height="196" fill="none" stroke="#ced7e4"/><text x="1357" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Compute</text><rect x="0" y="297" width="1600" height="196" fill="#f7f9fc"/><rect x="0" y="297" width="246" height="196" fill="none" stroke="#ced7e4"/><text x="18" y="339" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Tall-skinny [8,7</text><text x="18" y="371" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">168]×[7168,2048]</text><rect x="246" y="297" width="359" height="196" fill="none" stroke="#ced7e4"/><text x="264" y="339" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Reading weights : K·N is</text><text x="264" y="371" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">99% I = 2M/bpp = 2M , M=8</text><text x="264" y="403" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">→ 16</text><rect x="605" y="297" width="352" height="196" fill="none" stroke="#ced7e4"/><text x="623" y="339" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">P = min(296, 8M); M=8:</text><text x="623" y="371" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">64T, 22% utilization M*</text><text x="623" y="403" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">= R·bpp/2 = 37</text><rect x="957" y="297" width="382" height="196" fill="none" stroke="#ced7e4"/><text x="975" y="339" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">✅ Primary technique :</text><text x="975" y="371" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">weight bytes are shared</text><text x="975" y="403" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">across the batch, so I</text><text x="975" y="435" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">grows linearly with M with</text><text x="975" y="467" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">no ceiling</text><rect x="1339" y="297" width="261" height="196" fill="none" stroke="#ced7e4"/><text x="1357" y="339" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Bandwidth</text><rect x="0" y="493" width="1600" height="196" fill="#ffffff"/><rect x="0" y="493" width="246" height="196" fill="none" stroke="#ced7e4"/><text x="18" y="535" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Flat (thin K) [4</text><text x="18" y="567" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">096,32]×[32,4096</text><text x="18" y="599" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">]</text><rect x="246" y="493" width="359" height="196" fill="none" stroke="#ced7e4"/><text x="264" y="535" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Writing output : M·N</text><text x="264" y="567" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">dominates I = 2K/bpp = 2K</text><text x="264" y="599" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">, K=32 → 64</text><rect x="605" y="493" width="352" height="196" fill="none" stroke="#ced7e4"/><text x="623" y="535" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">P = min(296, 8K); K=32:</text><text x="623" y="567" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">I=64&lt;R, bandwidth side;</text><text x="623" y="599" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">K=128: I=256, back to</text><text x="623" y="631" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the compute side K* = 37</text><rect x="957" y="493" width="382" height="196" fill="none" stroke="#ced7e4"/><text x="975" y="535" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">❌ M is not in I: adding a</text><text x="975" y="567" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">batch row = one more row</text><text x="975" y="599" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">computed + one more row</text><text x="975" y="631" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">written, so numerator and</text><text x="975" y="663" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">denominator grow together</text><rect x="1339" y="493" width="261" height="196" fill="none" stroke="#ced7e4"/><text x="1357" y="535" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Determined by K;</text><text x="1357" y="567" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">K&lt;37 is</text><text x="1357" y="599" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">bandwidth-bound</text><rect x="0" y="689" width="1600" height="260" fill="#f7f9fc"/><rect x="0" y="689" width="246" height="260" fill="none" stroke="#ced7e4"/><text x="18" y="731" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Both small</text><text x="18" y="763" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">[8,16]×[16,7168]</text><rect x="246" y="689" width="359" height="260" fill="none" stroke="#ced7e4"/><text x="264" y="731" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">M·K and K·N are</text><text x="264" y="763" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">comparable I =</text><text x="264" y="795" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">2MK/((M+K)·bpp) ,</text><text x="264" y="827" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">M=8,K=16 → 10.7</text><rect x="605" y="689" width="352" height="260" fill="none" stroke="#ced7e4"/><text x="623" y="731" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">P = 8MK/(M+K) = 42.7T,</text><text x="623" y="763" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">14% utilization</text><text x="623" y="795" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">saturation point</text><text x="623" y="827" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">unreachable</text><rect x="957" y="689" width="382" height="260" fill="none" stroke="#ced7e4"/><text x="975" y="731" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">⚠️ Helps, but has a</text><text x="975" y="763" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">ceiling: as M→∞, I → 2K/bpp</text><text x="975" y="795" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">= 32 &lt; R, so it never</text><text x="975" y="827" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">leaves the bandwidth region</text><rect x="1339" y="689" width="261" height="260" fill="none" stroke="#ced7e4"/><text x="1357" y="731" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Bandwidth + fixed</text><text x="1357" y="763" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">overhead</text><text x="1357" y="795" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(theoretical</text><text x="1357" y="827" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">T≈0.04μs;</text><text x="1357" y="859" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">measured, a</text><text x="1357" y="891" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">single kernel</text><text x="1357" y="923" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">takes ~2μs)</text></svg>