<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="270" viewBox="0 0 1600 270"><rect width="1600" height="270" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="409" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Backend</text><rect x="409" y="1" width="705" height="68" fill="none" stroke="#ced7e4"/><text x="427" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Approach</text><rect x="1114" y="1" width="486" height="68" fill="none" stroke="#ced7e4"/><text x="1132" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Number of collectives</text><rect x="0" y="69" width="1600" height="100" fill="#ffffff"/><rect x="0" y="69" width="409" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">AllGather + ReduceScatter</text><rect x="409" y="69" width="705" height="100" fill="none" stroke="#ced7e4"/><text x="427" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">AG the LSE → local correction → RS along heads (the</text><text x="427" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">MHA path uses AR and then slices)</text><rect x="1114" y="69" width="486" height="100" fill="none" stroke="#ced7e4"/><text x="1132" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">about 3 per layer (including the Q</text><text x="1132" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">AG)</text><rect x="0" y="169" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="169" width="409" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Packed All-to-All</text><rect x="409" y="169" width="705" height="100" fill="none" stroke="#ced7e4"/><text x="427" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">pack the output and LSE into one tensor, one a2a</text><text x="427" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">performs the transpose</text><rect x="1114" y="169" width="486" height="100" fill="none" stroke="#ced7e4"/><text x="1132" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Q AG + 1 a2a</text></svg>