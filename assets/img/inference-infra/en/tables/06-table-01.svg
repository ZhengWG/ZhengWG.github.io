<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="366" viewBox="0 0 1600 366"><rect width="1600" height="366" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="157" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Phase</text><rect x="157" y="1" width="303" height="68" fill="none" stroke="#ced7e4"/><text x="175" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Bottleneck type</text><rect x="460" y="1" width="335" height="68" fill="none" stroke="#ced7e4"/><text x="478" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Recommended hardware</text><rect x="795" y="1" width="364" height="68" fill="none" stroke="#ced7e4"/><text x="813" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Optimal batch</text><rect x="1159" y="1" width="441" height="68" fill="none" stroke="#ced7e4"/><text x="1177" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Parallelism strategy</text><rect x="0" y="69" width="1600" height="132" fill="#ffffff"/><rect x="0" y="69" width="157" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Prefill</text><rect x="157" y="69" width="303" height="132" fill="none" stroke="#ced7e4"/><text x="175" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">compute-bound (AI~s,</text><text x="175" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">in the thousands)</text><rect x="460" y="69" width="335" height="132" fill="none" stroke="#ced7e4"/><text x="478" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">compute-oriented</text><text x="478" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">accelerators</text><text x="478" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(H800/950PR)</text><rect x="795" y="69" width="364" height="132" fill="none" stroke="#ced7e4"/><text x="813" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">small (a single sequence</text><text x="813" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">already saturates the</text><text x="813" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">GPU)</text><rect x="1159" y="69" width="441" height="132" fill="none" stroke="#ced7e4"/><text x="1177" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">TP/PP (chunks as</text><text x="1177" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">micro-batches), DeepEP (normal,</text><text x="1177" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">contiguous GEMM), etc.</text><rect x="0" y="201" width="1600" height="164" fill="#f7f9fc"/><rect x="0" y="201" width="157" height="164" fill="none" stroke="#ced7e4"/><text x="18" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Decode</text><rect x="157" y="201" width="303" height="164" fill="none" stroke="#ced7e4"/><text x="175" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">bandwidth-bound</text><text x="175" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(B~tens)</text><rect x="460" y="201" width="335" height="164" fill="none" stroke="#ced7e4"/><text x="478" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">devices with high</text><text x="478" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">memory bandwidth</text><rect x="795" y="201" width="364" height="164" fill="none" stroke="#ced7e4"/><text x="813" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">large (constrained by the</text><text x="813" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">SLO and C(B); see Part 5</text><text x="813" y="307" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">)</text><rect x="1159" y="201" width="441" height="164" fill="none" stroke="#ced7e4"/><text x="1177" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">DP-attn+EP, DeepEP</text><text x="1177" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(low-latency), masked GEMM; the</text><text x="1177" y="307" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">SLO is judged by TPOT (P99),</text><text x="1177" y="339" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">etc.</text></svg>