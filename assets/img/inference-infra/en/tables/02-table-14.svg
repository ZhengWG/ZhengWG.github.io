<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="374" viewBox="0 0 1600 374"><rect width="1600" height="374" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="412" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49"></text><rect x="412" y="1" width="595" height="68" fill="none" stroke="#ced7e4"/><text x="430" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Prefill (chunk)</text><rect x="1007" y="1" width="593" height="68" fill="none" stroke="#ced7e4"/><text x="1025" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Decode (micro-batch)</text><rect x="0" y="69" width="1600" height="68" fill="#ffffff"/><rect x="0" y="69" width="412" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Pipeline unit</text><rect x="412" y="69" width="595" height="68" fill="none" stroke="#ced7e4"/><text x="430" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">consecutive chunks of the same request</text><rect x="1007" y="69" width="593" height="68" fill="none" stroke="#ced7e4"/><text x="1025" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">different request groups</text><rect x="0" y="137" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="137" width="412" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="179" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Input of the next unit</text><rect x="412" y="137" width="595" height="100" fill="none" stroke="#ced7e4"/><text x="430" y="179" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">known (the whole prompt is already in hand)</text><rect x="1007" y="137" width="593" height="100" fill="none" stroke="#ced7e4"/><text x="1025" y="179" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">unknown (must wait for the token to come</text><text x="1025" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">back around to PP0)</text><rect x="0" y="237" width="1600" height="68" fill="#ffffff"/><rect x="0" y="237" width="412" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Can it be filled?</text><rect x="412" y="237" width="595" height="68" fill="none" stroke="#ced7e4"/><text x="430" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">yes, apart from fill/drain at the ends</text><rect x="1007" y="237" width="593" height="68" fill="none" stroke="#ced7e4"/><text x="1025" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">yes, but only with other groups</text><rect x="0" y="305" width="1600" height="68" fill="#f7f9fc"/><rect x="0" y="305" width="412" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="347" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Effect on latency</text><rect x="412" y="305" width="595" height="68" fill="none" stroke="#ced7e4"/><text x="430" y="347" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">TTFT really is reduced</text><rect x="1007" y="305" width="593" height="68" fill="none" stroke="#ced7e4"/><text x="1025" y="347" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">TPOT is not reduced</text></svg>