<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="502" viewBox="0 0 1600 502"><rect width="1600" height="502" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="325" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Fix</text><rect x="325" y="1" width="617" height="68" fill="none" stroke="#ced7e4"/><text x="343" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Approach</text><rect x="942" y="1" width="658" height="68" fill="none" stroke="#ced7e4"/><text x="960" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Cost</text><rect x="0" y="69" width="1600" height="132" fill="#ffffff"/><rect x="0" y="69" width="325" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Equal-time splitting</text><rect x="325" y="69" width="617" height="132" fill="none" stroke="#ced7e4"/><text x="343" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">s_k = T·√(k/m) , longer chunks first, shorter</text><text x="343" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">later</text><rect x="942" y="69" width="658" height="132" fill="none" stroke="#ced7e4"/><text x="960" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the first chunk takes 35% of the sequence, which</text><text x="960" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">is unfriendly to memory and kernel sizes; α must</text><text x="960" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">also be estimated</text><rect x="0" y="201" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="201" width="325" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Mixed-batch filling</text><rect x="325" y="201" width="617" height="100" fill="none" stroke="#ced7e4"/><text x="343" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">equal-length chunks, with decode requests</text><text x="343" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">making up the difference</text><rect x="942" y="201" width="658" height="100" fill="none" stroke="#ced7e4"/><text x="960" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the scheduler must track a time budget rather</text><text x="960" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">than a token budget</text><rect x="0" y="301" width="1600" height="100" fill="#ffffff"/><rect x="0" y="301" width="325" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">More chunks</text><rect x="325" y="301" width="617" height="100" fill="none" stroke="#ced7e4"/><text x="343" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">with m ≥ 4×pp_size, the time difference</text><text x="343" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">between adjacent chunks is negligible</text><rect x="942" y="301" width="658" height="100" fill="none" stroke="#ced7e4"/><text x="960" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">smaller chunks make GEMMs tall and thin, which</text><text x="960" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">lowers MFU</text><rect x="0" y="401" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="401" width="325" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Mixed budget</text><rect x="325" y="401" width="617" height="100" fill="none" stroke="#ced7e4"/><text x="343" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">whichever comes first of a token budget and</text><text x="343" y="475" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">an attention-work budget</text><rect x="942" y="401" width="658" height="100" fill="none" stroke="#ced7e4"/><text x="960" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">an engineering approximation of equal-time</text><text x="960" y="475" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">splitting that avoids a long first chunk</text></svg>