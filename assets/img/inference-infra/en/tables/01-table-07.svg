<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="566" viewBox="0 0 1600 566"><rect width="1600" height="566" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="368" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Item</text><rect x="368" y="1" width="634" height="68" fill="none" stroke="#ced7e4"/><text x="386" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">RDMA (RoCE, GPUDirect)</text><rect x="1002" y="1" width="598" height="68" fill="none" stroke="#ced7e4"/><text x="1020" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">TCP (container network eth0, 200 Gb/s)</text><rect x="0" y="69" width="1600" height="100" fill="#ffffff"/><rect x="0" y="69" width="368" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Bandwidth</text><rect x="368" y="69" width="634" height="100" fill="none" stroke="#ced7e4"/><text x="386" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">392 Gb/s per NIC; 4 NICs bound by NUMA give 196</text><text x="386" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">GB/s/node (74% without binding)</text><rect x="1002" y="69" width="598" height="100" fill="none" stroke="#ced7e4"/><text x="1020" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">iperf3 with 32 streams 16.4 GB/s/node; 16</text><text x="1020" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">streams consume more than 3 CPU cores</text><rect x="0" y="169" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="169" width="368" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Small-message one-way</text><text x="18" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">latency</text><rect x="368" y="169" width="634" height="100" fill="none" stroke="#ced7e4"/><text x="386" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">9 μs</text><rect x="1002" y="169" width="598" height="100" fill="none" stroke="#ced7e4"/><text x="1020" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">56 μs</text><rect x="0" y="269" width="1600" height="164" fill="#ffffff"/><rect x="0" y="269" width="368" height="164" fill="none" stroke="#ced7e4"/><text x="18" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">NCCL cross-node (2×8 GPUs)</text><rect x="368" y="269" width="634" height="164" fill="none" stroke="#ced7e4"/><text x="386" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">AllReduce 128 MB 2.07 ms; 8-pair P2P 15.1</text><text x="386" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">GB/s/GPU</text><rect x="1002" y="269" width="598" height="164" fill="none" stroke="#ced7e4"/><text x="1020" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">12–28× slower (requires NCCL_NET_PLUGIN=none</text><text x="1020" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">NCCL_NET=Socket to actually go over TCP;</text><text x="1020" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">NCCL_IB_DISABLE is ignored by external</text><text x="1020" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">plugins)</text><rect x="0" y="433" width="1600" height="132" fill="#f7f9fc"/><rect x="0" y="433" width="368" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="475" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Affinity</text><rect x="368" y="433" width="634" height="132" fill="none" stroke="#ced7e4"/><text x="386" y="475" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Cross-NUMA GPU→NIC pairing halves bandwidth</text><text x="386" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(49→24 GB/s); disabling GDR drops P2P from</text><text x="386" y="539" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">15.1→7.3 GB/s</text><rect x="1002" y="433" width="598" height="132" fill="none" stroke="#ced7e4"/><text x="1020" y="475" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">—</text></svg>