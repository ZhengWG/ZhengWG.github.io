<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="662" viewBox="0 0 1600 662"><rect width="1600" height="662" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="202" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Method</text><rect x="202" y="1" width="370" height="68" fill="none" stroke="#ced7e4"/><text x="220" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Draft form</text><rect x="572" y="1" width="569" height="68" fill="none" stroke="#ced7e4"/><text x="590" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Core mechanism</text><rect x="1141" y="1" width="459" height="68" fill="none" stroke="#ced7e4"/><text x="1159" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Ceiling / measured</text><rect x="0" y="69" width="1600" height="100" fill="#ffffff"/><rect x="0" y="69" width="202" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">EAGLE-3</text><rect x="202" y="69" width="370" height="100" fill="none" stroke="#ced7e4"/><text x="220" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Small AR head on the</text><text x="220" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">target model&#x27;s features</text><rect x="572" y="69" width="569" height="100" fill="none" stroke="#ced7e4"/><text x="590" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Feature-level autoregression + tree</text><text x="590" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">attention for multi-path verification</text><rect x="1141" y="69" width="459" height="100" fill="none" stroke="#ced7e4"/><text x="1159" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Serial drafting caps out at 2-3×</text><rect x="0" y="169" width="1600" height="132" fill="#f7f9fc"/><rect x="0" y="169" width="202" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">MTP</text><rect x="202" y="169" width="370" height="132" fill="none" stroke="#ced7e4"/><text x="220" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">The model&#x27;s own</text><text x="220" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">multi-token heads (native</text><text x="220" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">in DS/Qwen)</text><rect x="572" y="169" width="569" height="132" fill="none" stroke="#ced7e4"/><text x="590" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Learned during training; 1 step τ≈1.8-2;</text><text x="590" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">measured on Qwen3.5, 3 steps give an</text><text x="590" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">acceptance length of 3.1</text><rect x="1141" y="169" width="459" height="132" fill="none" stroke="#ced7e4"/><text x="1159" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">TPOT at concurrency 1/8/32:</text><text x="1159" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">2.45/5.1/7.6 ms (without it:</text><text x="1159" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">5.6/8.9/16.4)</text><rect x="0" y="301" width="1600" height="164" fill="#ffffff"/><rect x="0" y="301" width="202" height="164" fill="none" stroke="#ced7e4"/><text x="18" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">DFlash</text><rect x="202" y="301" width="370" height="164" fill="none" stroke="#ced7e4"/><text x="220" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Small block-diffusion</text><text x="220" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">model</text><rect x="572" y="301" width="569" height="164" fill="none" stroke="#ced7e4"/><text x="590" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">One forward pass produces a whole draft</text><text x="590" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">block (in parallel!) + injecting</text><text x="590" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">target-model features/KV to raise the</text><text x="590" y="439" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">acceptance rate</text><rect x="1141" y="301" width="459" height="164" fill="none" stroke="#ced7e4"/><text x="1159" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">6× lossless, up to 2.5× higher</text><text x="1159" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">than EAGLE-3; gpt-oss-120b</text><text x="1159" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">reaches 15× on Blackwell</text><rect x="0" y="465" width="1600" height="196" fill="#f7f9fc"/><rect x="0" y="465" width="202" height="196" fill="none" stroke="#ced7e4"/><text x="18" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">DSpark</text><text x="18" y="539" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(DeepSpec)</text><rect x="202" y="465" width="370" height="196" fill="none" stroke="#ced7e4"/><text x="220" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Built on DFlash</text><rect x="572" y="465" width="569" height="196" fill="none" stroke="#ced7e4"/><text x="590" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">① Semi-autoregressive generation:</text><text x="590" y="539" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">recovers the dependencies between tokens</text><text x="590" y="571" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">within a block (lost in pure diffusion) ②</text><text x="590" y="603" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Confidence-scheduled verification:</text><text x="590" y="635" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">speculate only when confident</text><rect x="1141" y="465" width="459" height="196" fill="none" stroke="#ced7e4"/><text x="1159" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">In use in DS-V4 production</text><text x="1159" y="539" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">serving</text></svg>