<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="666" viewBox="0 0 1600 666"><rect width="1600" height="666" fill="#ffffff"/><rect x="0" y="1" width="1600" height="100" fill="#eaf0f9"/><rect x="0" y="1" width="186" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Scheme</text><rect x="186" y="1" width="278" height="100" fill="none" stroke="#ced7e4"/><text x="204" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">What is sent</text><rect x="464" y="1" width="291" height="100" fill="none" stroke="#ced7e4"/><text x="482" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Communication per</text><text x="482" y="75" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">GPU per layer</text><rect x="755" y="1" width="254" height="100" fill="none" stroke="#ced7e4"/><text x="773" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Compute/GPU</text><rect x="1009" y="1" width="240" height="100" fill="none" stroke="#ced7e4"/><text x="1027" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Memory benefit</text><rect x="1249" y="1" width="351" height="100" fill="none" stroke="#ced7e4"/><text x="1267" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Hard constraint</text><rect x="0" y="101" width="1600" height="100" fill="#ffffff"/><rect x="0" y="101" width="186" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Ring</text><rect x="186" y="101" width="278" height="100" fill="none" stroke="#ced7e4"/><text x="204" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="4