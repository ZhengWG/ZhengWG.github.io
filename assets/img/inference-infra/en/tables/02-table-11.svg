witching</text><text x="204" y="307" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">a2a</text><rect x="464" y="201" width="291" height="132" fill="none" stroke="#ced7e4"/><text x="482" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">4c·T·d/N (2/N of</text><text x="482" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Ring)</text><rect x="755" y="201" width="254" height="132" fill="none" stroke="#ced7e4"/><text x="773" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">same as above</text><rect x="1009" y="201" width="240" height="132" fill="none" stroke="#ced7e4"/><text x="1027" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">activations</text><text x="1027" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">O(T·d/N)</text><rect x="1249" y="201" width="351" height="132" fill="none" stroke="#ced7e4"/><text x="1267" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">N ≤ number of heads ;</text><text x="1267" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">MLA unusable</text><rect x="0" y="333" width="1600" height="132" fill="#ffffff"/><rect x="0" y="333" width="186" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Split + AG</text><rect x="186" y="333" width="278" height="132" fill="none" stroke="#ced7e4"/><text x="204" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">gather at the end</text><rect x="464" y="333" width="291" height="132" fill="none" stroke="#ced7e4"/><text x="482" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">on the order of</text><text x="482" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">c·T·d</text><rect x="755" y="333" width="254" height="132" fill="none" stroke="#ced7e4"/><text x="773" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">same as above</text><rect x="1009" y="333" width="240" height="132" fill="none" stroke="#ced7e4"/><text x="1027" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">no activation</text><text x="1027" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">saving</text><rect x="1249" y="333" width="351" height="132" fill="none" stroke="#ced7e4"/><text x="1267" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">no head limit; a single</text><text x="1267" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">GPU must hold the full</text><text x="1267" y="439" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">sequence</text><rect x="0" y="465" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="465" width="186" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">zigzag /</text><text x="18" y="539" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">interleave</text><rect x="186" y="465" width="278" height="100" fill="none" stroke="#ced7e4"/><text x="204" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">— (sharding</text><text x="204" y="539" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">strategy)</text><rect x="464" y="465" width="291" height="100" fill="none" stroke="#ced7e4"/><text x="482" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">no increase</text><rect x="755" y="465" width="254" height="100" fill="none" stroke="#ced7e4"/><text x="773" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">slowest GPU 2× →</text><text x="773" y="539" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">1×</text><rect x="1009" y="465" width="240" height="100" fill="none" stroke="#ced7e4"/><text x="1027" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">—</text><rect x="1249" y="465" width="351" height="100" fill="none" stroke="#ced7e4"/><text x="1267" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">none; should be on by</text><text x="1267" y="539" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">default</text><rect x="0" y="565" width="1600" height="100" fill="#ffffff"/><rect x="0" y="565" width="186" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="607" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">DCP</text><rect x="186" y="565" width="278" height="100" fill="none" stroke="#ced7e4"/><text x="204" y="607" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Q + partial results</text><rect x="464" y="565" width="291" height="100" fill="none" stroke="#ced7e4"/><text x="482" y="607" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">O(B·H·D) ,</text><text x="482" y="639" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">independent of T</text><rect x="755" y="565" width="254" height="100" fill="none" stroke="#ced7e4"/><text x="773" y="607" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">same as without</text><text x="773" y="639" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">DCP</text><rect x="1009" y="565" width="240" height="100" fill="none" stroke="#ced7e4"/><text x="1027" y="607" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">KV O(T·E/N)</text><rect x="1249" y="565" width="351" height="100" fill="none" stroke="#ced7e4"/><text x="1267" y="607" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">GQA: N ≤ TP ÷ number of</text><text x="1267" y="639" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">KV heads</text></svg>