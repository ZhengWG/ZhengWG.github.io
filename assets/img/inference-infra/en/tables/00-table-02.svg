<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="338" viewBox="0 0 1600 338"><rect width="1600" height="338" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="320" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Form</text><rect x="320" y="1" width="594" height="68" fill="none" stroke="#ced7e4"/><text x="338" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Formula</text><rect x="914" y="1" width="686" height="68" fill="none" stroke="#ced7e4"/><text x="932" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">When to use</text><rect x="0" y="69" width="1600" height="68" fill="#ffffff"/><rect x="0" y="69" width="320" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Time</text><rect x="320" y="69" width="594" height="68" fill="none" stroke="#ced7e4"/><text x="338" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">T ≥ max(W/F, Q/BW)</text><rect x="914" y="69" width="686" height="68" fill="none" stroke="#ced7e4"/><text x="932" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Latency budgets, setting SLOs</text><rect x="0" y="137" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="137" width="320" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="179" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Performance</text><rect x="320" y="137" width="594" height="100" fill="none" stroke="#ced7e4"/><text x="338" y="179" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">P = W/T ≤ min(F, I×BW)</text><rect x="914" y="137" width="686" height="100" fill="none" stroke="#ced7e4"/><text x="932" y="179" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Effective compute throughput as plotted on the</text><text x="932" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Roofline chart</text><rect x="0" y="237" width="1600" height="100" fill="#ffffff"/><rect x="0" y="237" width="320" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Utilization</text><rect x="320" y="237" width="594" height="100" fill="none" stroke="#ced7e4"/><text x="338" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">compute utilization ≤ min(1, I/R) ,</text><text x="338" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">bandwidth utilization ≤ min(1, R/I)</text><rect x="914" y="237" width="686" height="100" fill="none" stroke="#ced7e4"/><text x="932" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Day-to-day judgment of whether a kernel is doing</text><text x="932" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">its job well</text></svg>