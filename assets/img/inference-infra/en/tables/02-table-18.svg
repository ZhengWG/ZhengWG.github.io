<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="438" viewBox="0 0 1600 438"><rect width="1600" height="438" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="429" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Category</text><rect x="429" y="1" width="1171" height="68" fill="none" stroke="#ced7e4"/><text x="447" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">What changes</text><rect x="0" y="69" width="1600" height="100" fill="#ffffff"/><rect x="0" y="69" width="429" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Protocol</text><rect x="429" y="69" width="1171" height="100" fill="none" stroke="#ced7e4"/><text x="447" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the output ring carries accept_len , the accepted token ids, and the next round&#x27;s</text><text x="447" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">proposals, instead of a single token id</text><rect x="0" y="169" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="169" width="429" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Timing</text><rect x="429" y="169" width="1171" height="100" fill="none" stroke="#ced7e4"/><text x="447" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the next verify must wait until all ranks have trimmed gamma+1−k KV slots → async depth</text><text x="447" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">drops to zero</text><rect x="0" y="269" width="1600" height="100" fill="#ffffff"/><rect x="0" y="269" width="429" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Execution layer</text><rect x="429" y="269" width="1171" height="100" fill="none" stroke="#ced7e4"/><text x="447" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">each stage needs a CUDA graph with q_len=gamma+1 ; non-last ranks cannot call draft() ;</text><text x="447" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">verify hidden states must be able to cross stages</text><rect x="0" y="369" width="1600" height="68" fill="#f7f9fc"/><rect x="0" y="369" width="429" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="411" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">State</text><rect x="429" y="369" width="1171" height="68" fill="none" stroke="#ced7e4"/><text x="447" y="411" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">temporary slots of hybrid-architecture models must be rolled back on every rank</text></svg>