<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="334" viewBox="0 0 1600 334"><rect width="1600" height="334" fill="#ffffff"/><rect x="0" y="1" width="1600" height="100" fill="#eaf0f9"/><rect x="0" y="1" width="247" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Phase</text><rect x="247" y="1" width="354" height="100" fill="none" stroke="#ced7e4"/><text x="265" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">FLOPs (per head)</text><rect x="601" y="1" width="399" height="100" fill="none" stroke="#ced7e4"/><text x="619" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">HBM bytes (per head, fused</text><text x="619" y="75" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">implementation)</text><rect x="1000" y="1" width="241" height="100" fill="none" stroke="#ced7e4"/><text x="1018" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">I = W/Q</text><rect x="1241" y="1" width="359" height="100" fill="none" stroke="#ced7e4"/><text x="1259" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Bottleneck</text><rect x="0" y="101" width="1600" height="100" fill="#ffffff"/><rect x="0" y="101" width="247" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">prefill</text><text x="18" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(q_len=s)</text><rect x="247" y="101" width="354" height="100" fill="none" stroke="#ced7e4"/><text x="265" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">4·s²·h_d = 2×(QKᵀ) +</text><text x="265" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">2×(PV)</text><rect x="601" y="101" width="399" height="100" fill="none" stroke="#ced7e4"/><text x="619" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">4·s·h_d·bpp (read QKV +</text><text x="619" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">write O)</text><rect x="1000" y="101" width="241" height="100" fill="none" stroke="#ced7e4"/><text x="1018" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">s/bpp</text><rect x="1241" y="101" width="359" height="100" fill="none" stroke="#ced7e4"/><text x="1259" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Compute when s is large</text><rect x="0" y="201" width="1600" height="132" fill="#f7f9fc"/><rect x="0" y="201" width="247" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">decode (q_len=1)</text><rect x="247" y="201" width="354" height="132" fill="none" stroke="#ced7e4"/><text x="265" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">4·s·h_d·g (g Q heads</text><text x="265" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">share one set of KV)</text><rect x="601" y="201" width="399" height="132" fill="none" stroke="#ced7e4"/><text x="619" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">2·s·h_d·bpp (read K and V</text><text x="619" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">once each)</text><rect x="1000" y="201" width="241" height="132" fill="none" stroke="#ced7e4"/><text x="1018" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">2g/bpp (MHA g=1,</text><text x="1018" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">BF16≈1)</text><rect x="1241" y="201" width="359" height="132" fill="none" stroke="#ced7e4"/><text x="1259" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">MHA is always</text><text x="1259" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">bandwidth-bound; for</text><text x="1259" y="307" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">GQA/MLA see below</text></svg>