<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="610" viewBox="0 0 1600 610"><rect width="1600" height="610" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="432" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Item</text><rect x="432" y="1" width="1168" height="68" fill="none" stroke="#ced7e4"/><text x="450" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Measured</text><rect x="0" y="69" width="1600" height="68" fill="#ffffff"/><rect x="0" y="69" width="432" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Compute throughput</text><rect x="432" y="69" width="1168" height="68" fill="none" stroke="#ced7e4"/><text x="450" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">BF16 138T (93%), FP8 282T (95%), DeepGEMM blockwise FP8 264–272T</text><rect x="0" y="137" width="1600" height="68" fill="#f7f9fc"/><rect x="0" y="137" width="432" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="179" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">HBM</text><rect x="432" y="137" width="1168" height="68" fill="none" stroke="#ced7e4"/><text x="450" y="179" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">copy 3.33 TB/s, read-only 3.2–3.3, write-only 3.4 (83–85%) ⟹ R_eff ≈ 42 / 85</text><rect x="0" y="205" width="1600" height="68" fill="#ffffff"/><rect x="0" y="205" width="432" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="247" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">On-chip</text><rect x="432" y="205" width="1168" height="68" fill="none" stroke="#ced7e4"/><text x="450" y="247" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">78 SMs, L2 60 MB, SMEM 228 KB/SM (227 KB per block)</text><rect x="0" y="273" width="1600" height="68" fill="#f7f9fc"/><rect x="0" y="273" width="432" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="315" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">NVLink</text><rect x="432" y="273" width="1168" height="68" fill="none" stroke="#ced7e4"/><text x="450" y="315" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">18 × 26.56 GB/s = 478 GB/s per direction; P2P copy 395 GB/s</text><rect x="0" y="341" width="1600" height="68" fill="#ffffff"/><rect x="0" y="341" width="432" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="383" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">PCIe</text><rect x="432" y="341" width="1168" height="68" fill="none" stroke="#ced7e4"/><text x="450" y="383" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Gen5 ×16, pinned H2D/D2H 54–55 GB/s, preallocated pageable 13–16 GB/s</text><rect x="0" y="409" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="409" width="432" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="451" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">NIC</text><rect x="432" y="409" width="1168" height="100" fill="none" stroke="#ced7e4"/><text x="450" y="451" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">4 × 400G RoCE bond (NIC0–3 share a PCIe switch with GPU1/3/4/6 respectively), single-NIC</text><text x="450" y="483" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">RDMA 392 Gb/s</text><rect x="0" y="509" width="1600" height="100" fill="#ffffff"/><rect x="0" y="509" width="432" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="551" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Kernel launch</text><rect x="432" y="509" width="1168" height="100" fill="none" stroke="#ced7e4"/><text x="450" y="551" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">raw cudaLaunchKernel 1.9 μs; PyTorch eager 4.5–12 μs/op; cudaGraphLaunch 2.9 μs on the</text><text x="450" y="583" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">host side, 0.76 μs per node on the GPU side</text></svg>