<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="806" viewBox="0 0 1600 806"><rect width="1600" height="806" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="597" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Scenario</text><rect x="597" y="1" width="328" height="68" fill="none" stroke="#ced7e4"/><text x="615" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Scheme</text><rect x="925" y="1" width="675" height="68" fill="none" stroke="#ced7e4"/><text x="943" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Reason</text><rect x="0" y="69" width="1600" height="100" fill="#ffffff"/><rect x="0" y="69" width="597" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Long prefill, TTFT-bound, activations do not</text><text x="18" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">fit on one GPU</text><rect x="597" y="69" width="328" height="100" fill="none" stroke="#ced7e4"/><text x="615" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Prefill CP</text><rect x="925" y="69" width="675" height="100" fill="none" stroke="#ced7e4"/><text x="943" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">compute and activations are spread across N GPUs</text><rect x="0" y="169" width="1600" height="68" fill="#f7f9fc"/><rect x="0" y="169" width="597" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">↳ enough heads, high intra-node bandwidth</text><rect x="597" y="169" width="328" height="68" fill="none" stroke="#ced7e4"/><text x="615" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Ulysses</text><rect x="925" y="169" width="675" height="68" fill="none" stroke="#ced7e4"/><text x="943" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">communication is only 2/N of Ring, in just 2 steps</text><rect x="0" y="237" width="1600" height="100" fill="#ffffff"/><rect x="0" y="237" width="597" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">↳ too few heads / MLA / extremely long</text><text x="18" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">sequences</text><rect x="597" y="237" width="328" height="100" fill="none" stroke="#ced7e4"/><text x="615" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Ring</text><rect x="925" y="237" width="675" height="100" fill="none" stroke="#ced7e4"/><text x="943" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">no head limit; communication can overlap with</text><text x="943" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">compute</text><rect x="0" y="337" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="337" width="597" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="379" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">↳ only need to spread compute, activations</text><text x="18" y="411" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">fit</text><rect x="597" y="337" width="328" height="100" fill="none" stroke="#ced7e4"/><text x="615" y="379" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Split + AG</text><rect x="925" y="337" width="675" height="100" fill="none" stroke="#ced7e4"/><text x="943" y="379" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the cheapest communication; covers MLA and sparse</text><text x="943" y="411" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">paths</text><rect x="0" y="437" width="1600" height="100" fill="#ffffff"/><rect x="0" y="437" width="597" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="479" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">↳ any causal workload</text><rect x="597" y="437" width="328" height="100" fill="none" stroke="#ced7e4"/><text x="615" y="479" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Add zigzag /</text><text x="615" y="511" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">interleave</text><rect x="925" y="437" width="675" height="100" fill="none" stroke="#ced7e4"/><text x="943" y="479" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">a free 2×; sparse paths use interleave</text><rect x="0" y="537" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="537" width="597" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="579" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Decode KV capacity caps concurrency</text><rect x="597" y="537" width="328" height="100" fill="none" stroke="#ced7e4"/><text x="615" y="579" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">DCP</text><rect x="925" y="537" width="675" height="100" fill="none" stroke="#ced7e4"/><text x="943" y="579" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">per-GPU KV drops to 1/N; communication is</text><text x="943" y="611" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">decoupled from T</text><rect x="0" y="637" width="1600" height="100" fill="#ffffff"/><rect x="0" y="637" width="597" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="679" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">↳ multi-head latent attention</text><rect x="597" y="637" width="328" height="100" fill="none" stroke="#ced7e4"/><text x="615" y="679" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">DCP pays off the most</text><rect x="925" y="637" width="675" height="100" fill="none" stroke="#ced7e4"/><text x="943" y="679" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">tensor parallelism cannot split it at all; N can</text><text x="943" y="711" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">go up to the TP degree</text><rect x="0" y="737" width="1600" height="68" fill="#f7f9fc"/><rect x="0" y="737" width="597" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="779" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">↳ GQA with TP degree &gt; number of KV heads</text><rect x="597" y="737" width="328" height="68" fill="none" stroke="#ced7e4"/><text x="615" y="779" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">DCP</text><rect x="925" y="737" width="675" height="68" fill="none" stroke="#ced7e4"/><text x="943" y="779" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">turns the excess replication into sequence shards</text></svg>