<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1014" viewBox="0 0 1600 1014"><rect width="1600" height="1014" fill="#ffffff"/><rect x="0" y="1" width="1600" height="100" fill="#eaf0f9"/><rect x="0" y="1" width="277" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Hardware</text><rect x="277" y="1" width="193" height="100" fill="none" stroke="#ced7e4"/><text x="295" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Native MMA</text><text x="295" y="75" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">support</text><rect x="470" y="1" width="310" height="100" fill="none" stroke="#ced7e4"/><text x="488" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Recommended route</text><rect x="780" y="1" width="515" height="100" fill="none" stroke="#ced7e4"/><text x="798" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Nature of the dequantization overhead</text><rect x="1295" y="1" width="305" height="100" fill="none" stroke="#ced7e4"/><text x="1313" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Applicable scenarios</text><rect x="0" y="101" width="1600" height="388" fill="#ffffff"/><rect x="0" y="101" width="277" height="388" fill="none" stroke="#ced7e4"/><text x="18" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Hopper (SM90)</text><rect x="277" y="101" width="193" height="388" fill="none" stroke="#ced7e4"/><text x="295" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">FP8</text><rect x="470" y="101" width="310" height="388" fill="none" stroke="#ced7e4"/><text x="488" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">FP8 on both sides</text><text x="488" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(DeepGEMM)</text><rect x="780" y="101" width="515" height="388" fill="none" stroke="#ced7e4"/><text x="798" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">No dequantization: weights and</text><text x="798" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">activations are both FP8 and go</text><text x="798" y="207" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">straight into WGMMA. The overhead</text><text x="798" y="239" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">turns into promotion — every 128 K</text><text x="798" y="271" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">elements, the CUDA cores multiply the</text><text x="798" y="303" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Tensor Core partial sums by the scale</text><text x="798" y="335" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">and promote them to FP32. Because</text><text x="798" y="367" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">CUDA cores and Tensor Cores are</text><text x="798" y="399" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">physically independent, this step can</text><text x="798" y="431" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">overlap with the next batch of matrix</text><text x="798" y="463" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">multiplications (MMA)</text><rect x="1295" y="101" width="305" height="388" fill="none" stroke="#ced7e4"/><text x="1313" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">General purpose</text><rect x="0" y="489" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="489" width="277" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="531" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Blackwell (SM100+)</text><rect x="277" y="489" width="193" height="100" fill="none" stroke="#ced7e4"/><text x="295" y="531" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">FP4</text><rect x="470" y="489" width="310" height="100" fill="none" stroke="#ced7e4"/><text x="488" y="531" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">FP4 (the DS-V4 route)</text><rect x="780" y="489" width="515" height="100" fill="none" stroke="#ced7e4"/><text x="798" y="531" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Same as above, with finer granularity</text><text x="798" y="563" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(weight bytes halved again)</text><rect x="1295" y="489" width="305" height="100" fill="none" stroke="#ced7e4"/><text x="1313" y="531" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">General purpose</text><rect x="0" y="589" width="1600" height="100" fill="#ffffff"/><rect x="0" y="589" width="277" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="631" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Ampere / Turing /</text><text x="18" y="663" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">NPU</text><rect x="277" y="589" width="193" height="100" fill="none" stroke="#ced7e4"/><text x="295" y="631" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">INT8</text><rect x="470" y="589" width="310" height="100" fill="none" stroke="#ced7e4"/><text x="488" y="631" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">W8A8 on both sides</text><rect x="780" y="589" width="515" height="100" fill="none" stroke="#ced7e4"/><text x="798" y="631" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">None (INT8 goes straight into MMA)</text><rect x="1295" y="589" width="305" height="100" fill="none" stroke="#ced7e4"/><text x="1313" y="631" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">High concurrency</text><rect x="0" y="689" width="1600" height="324" fill="#f7f9fc"/><rect x="0" y="689" width="277" height="324" fill="none" stroke="#ced7e4"/><text x="18" y="731" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Ampere / older</text><text x="18" y="763" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">GPUs / NPU</text><rect x="277" y="689" width="193" height="324" fill="none" stroke="#ced7e4"/><text x="295" y="731" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">No FP8/FP4</text><rect x="470" y="689" width="310" height="324" fill="none" stroke="#ced7e4"/><text x="488" y="731" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">INT4 weight-only</text><text x="488" y="763" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(Marlin)</text><rect x="780" y="689" width="515" height="324" fill="none" stroke="#ced7e4"/><text x="798" y="731" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Real dequantization: INT4 weights</text><text x="798" y="763" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">must first be unpacked + multiplied</text><text x="798" y="795" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">by the scale to restore FP16 before</text><text x="798" y="827" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">they can enter MMA. These</text><text x="798" y="859" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">instructions run on CUDA cores and</text><text x="798" y="891" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">can only be squeezed into the gaps</text><text x="798" y="923" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">between MMAs through</text><text x="798" y="955" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">instruction-level parallelism (ILP);</text><text x="798" y="987" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">if they don&#x27;t fit, it is a net loss</text><rect x="1295" y="689" width="305" height="324" fill="none" stroke="#ced7e4"/><text x="1313" y="731" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Small-batch decode /</text><text x="1313" y="763" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">saving GPU memory</text></svg>