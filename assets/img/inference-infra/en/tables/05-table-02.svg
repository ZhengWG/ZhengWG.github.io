<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="466" viewBox="0 0 1600 466"><rect width="1600" height="466" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="327" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Chain</text><rect x="327" y="1" width="496" height="68" fill="none" stroke="#ced7e4"/><text x="345" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Symptom</text><rect x="823" y="1" width="225" height="68" fill="none" stroke="#ced7e4"/><text x="841" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Who treats it</text><rect x="1048" y="1" width="552" height="68" fill="none" stroke="#ced7e4"/><text x="1066" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Mechanism</text><rect x="0" y="69" width="1600" height="132" fill="#ffffff"/><rect x="0" y="69" width="327" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">all2all bytes ∝ B</text><rect x="327" y="69" width="496" height="132" fill="none" stroke="#ced7e4"/><text x="345" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">cross-node communication becomes the</text><text x="345" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">new bottleneck</text><rect x="823" y="69" width="225" height="132" fill="none" stroke="#ced7e4"/><text x="841" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">DeepEP</text><rect x="1048" y="69" width="552" height="132" fill="none" stroke="#ced7e4"/><text x="1066" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">turns communication from an &quot;additive</text><text x="1066" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">term&quot; into &quot;a term that compute can</text><text x="1066" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">hide&quot;</text><rect x="0" y="201" width="1600" height="132" fill="#f7f9fc"/><rect x="0" y="201" width="327" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">M_e falls in the</text><text x="18" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">padding region</text><rect x="327" y="201" width="496" height="132" fill="none" stroke="#ced7e4"/><text x="345" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">compute is spent on pad rows, a 10×</text><text x="345" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">waste</text><rect x="823" y="201" width="225" height="132" fill="none" stroke="#ced7e4"/><text x="841" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">DeepGEMM</text><rect x="1048" y="201" width="552" height="132" fill="none" stroke="#ced7e4"/><text x="1066" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">lets static shapes hold dynamic loads,</text><text x="1066" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">cutting the pad granularity down to the</text><text x="1066" y="307" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">real M_e</text><rect x="0" y="333" width="1600" height="132" fill="#ffffff"/><rect x="0" y="333" width="327" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Uneven expert load</text><rect x="327" y="333" width="496" height="132" fill="none" stroke="#ced7e4"/><text x="345" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the all2all synchronization barrier</text><text x="345" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">→ the slowest GPU determines the</text><text x="345" y="439" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">whole layer</text><rect x="823" y="333" width="225" height="132" fill="none" stroke="#ced7e4"/><text x="841" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">EPLB</text><rect x="1048" y="333" width="552" height="132" fill="none" stroke="#ced7e4"/><text x="1066" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">spreads out hot experts, pushing</text><text x="1066" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">max/mean back to 1</text></svg>