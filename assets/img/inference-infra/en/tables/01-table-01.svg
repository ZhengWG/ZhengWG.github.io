<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030"><rect width="1600" height="1030" fill="#ffffff"/><rect x="0" y="1" width="1600" height="100" fill="#eaf0f9"/><rect x="0" y="1" width="147" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Category</text><rect x="147" y="1" width="203" height="100" fill="none" stroke="#ced7e4"/><text x="165" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Primitive /</text><text x="165" y="75" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">algorithm</text><rect x="350" y="1" width="373" height="100" fill="none" stroke="#ced7e4"/><text x="368" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Semantics or mechanism</text><rect x="723" y="1" width="314" height="100" fill="none" stroke="#ced7e4"/><text x="741" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Bytes per GPU</text><rect x="1037" y="1" width="197" height="100" fill="none" stroke="#ced7e4"/><text x="1055" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Steps</text><rect x="1234" y="1" width="366" height="100" fill="none" stroke="#ced7e4"/><text x="1252" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Notes</text><rect x="0" y="101" width="1600" height="100" fill="#ffffff"/><rect x="0" y="101" width="147" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Many-to-m</text><text x="18" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">any</text><rect x="147" y="101" width="203" height="100" fill="none" stroke="#ced7e4"/><text x="165" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">★</text><text x="165" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">ReduceScatter</text><rect x="350" y="101" width="373" height="100" fill="none" stroke="#ced7e4"/><text x="368" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Each GPU gets 1/P of the</text><text x="368" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">reduced result</text><rect x="723" y="101" width="314" height="100" fill="none" stroke="#ced7e4"/><text x="741" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(P−1)/P·S ✓lower</text><text x="741" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">bound</text><rect x="1037" y="101" width="197" height="100" fill="none" stroke="#ced7e4"/><text x="1055" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">P−1 (ring)</text><rect x="1234" y="101" width="366" height="100" fill="none" stroke="#ced7e4"/><text x="1252" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Every GPU sends; P NICs</text><text x="1252" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">work in parallel</text><rect x="0" y="201" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="201" width="147" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49"></text><rect x="147" y="201" width="203" height="100" fill="none" stroke="#ced7e4"/><text x="165" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">★ AllGather</text><rect x="350" y="201" width="373" height="100" fill="none" stroke="#ced7e4"/><text x="368" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Each GPU gets the full</text><text x="368" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">concatenation</text><rect x="723" y="201" width="314" height="100" fill="none" stroke="#ced7e4"/><text x="741" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(P−1)/P·S ✓lower</text><text x="741" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">bound</text><rect x="1037" y="201" width="197" height="100" fill="none" stroke="#ced7e4"/><text x="1055" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">P−1 (ring)</text><rect x="1234" y="201" width="366" height="100" fill="none" stroke="#ced7e4"/><text x="1252" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">= the reverse of</text><text x="1252" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">ReduceScatter</text><rect x="0" y="301" width="1600" height="100" fill="#ffffff"/><rect x="0" y="301" width="147" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49"></text><rect x="147" y="301" width="203" height="100" fill="none" stroke="#ced7e4"/><text x="165" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">★ AllReduce</text><rect x="350" y="301" width="373" height="100" fill="none" stroke="#ced7e4"/><text x="368" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Each GPU gets the full</text><text x="368" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">reduction</text><rect x="723" y="301" width="314" height="100" fill="none" stroke="#ced7e4"/><text x="741" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">2(P−1)/P·S ✓lower</text><text x="741" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">bound</text><rect x="1037" y="301" width="197" height="100" fill="none" stroke="#ced7e4"/><text x="1055" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">2(P−1)</text><text x="1055" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(ring)</text><rect x="1234" y="301" width="366" height="100" fill="none" stroke="#ced7e4"/><text x="1252" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">= RS + AG; see the</text><text x="1252" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">variants below</text><rect x="0" y="401" width="1600" height="132" fill="#f7f9fc"/><rect x="0" y="401" width="147" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49"></text><rect x="147" y="401" width="203" height="132" fill="none" stroke="#ced7e4"/><text x="165" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">★ AllToAll</text><rect x="350" y="401" width="373" height="132" fill="none" stroke="#ced7e4"/><text x="368" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Each GPU sends different</text><text x="368" y="475" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">data to every GPU (block</text><text x="368" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">transpose)</text><rect x="723" y="401" width="314" height="132" fill="none" stroke="#ced7e4"/><text x="741" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(P−1)/P·S ✓lower</text><text x="741" y="475" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">bound</text><rect x="1037" y="401" width="197" height="132" fill="none" stroke="#ced7e4"/><text x="1055" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">1 (all pairs</text><text x="1055" y="475" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">concurrently</text><text x="1055" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">)</text><rect x="1234" y="401" width="366" height="132" fill="none" stroke="#ced7e4"/><text x="1252" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Bytes are fixed by the</text><text x="1252" y="475" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">semantics and cannot be</text><text x="1252" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">saved</text><rect x="0" y="533" width="1600" height="132" fill="#ffffff"/><rect x="0" y="533" width="147" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="575" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Single</text><text x="18" y="607" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">endpoint</text><rect x="147" y="533" width="203" height="132" fill="none" stroke="#ced7e4"/><text x="165" y="575" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Broadcast</text><rect x="350" y="533" width="373" height="132" fill="none" stroke="#ced7e4"/><text x="368" y="575" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">root sends the same</text><text x="368" y="607" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">content to all GPUs</text><rect x="723" y="533" width="314" height="132" fill="none" stroke="#ced7e4"/><text x="741" y="575" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">root sends (P−1)·S</text><text x="741" y="607" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(naive); each GPU</text><text x="741" y="639" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">receives S</text><rect x="1037" y="533" width="197" height="132" fill="none" stroke="#ced7e4"/><text x="1055" y="575" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">log₂P (tree)</text><rect x="1234" y="533" width="366" height="132" fill="none" stroke="#ced7e4"/><text x="1252" y="575" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">The naive implementation</text><text x="1252" y="607" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">bottlenecks on root</text><text x="1252" y="639" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">egress</text><rect x="0" y="665" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="665" width="147" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="707" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49"></text><rect x="147" y="665" width="203" height="100" fill="none" stroke="#ced7e4"/><text x="165" y="707" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Scatter</text><rect x="350" y="665" width="373" height="100" fill="none" stroke="#ced7e4"/><text x="368" y="707" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">root sends a different</text><text x="368" y="739" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">slice to each GPU</text><rect x="723" y="665" width="314" height="100" fill="none" stroke="#ced7e4"/><text x="741" y="707" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">root sends (P−1)/P·S;</text><text x="741" y="739" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">each GPU receives S/P</text><rect x="1037" y="665" width="197" height="100" fill="none" stroke="#ced7e4"/><text x="1055" y="707" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">1</text><rect x="1234" y="665" width="366" height="100" fill="none" stroke="#ced7e4"/><text x="1252" y="707" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Same bytes as RS, but all</text><text x="1252" y="739" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">squeezed through one NIC</text><rect x="0" y="765" width="1600" height="132" fill="#ffffff"/><rect x="0" y="765" width="147" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="807" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49"></text><rect x="147" y="765" width="203" height="132" fill="none" stroke="#ced7e4"/><text x="165" y="807" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Gather</text><rect x="350" y="765" width="373" height="132" fill="none" stroke="#ced7e4"/><text x="368" y="807" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Each GPU&#x27;s data is</text><text x="368" y="839" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">collected and concatenated</text><text x="368" y="871" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">at root</text><rect x="723" y="765" width="314" height="132" fill="none" stroke="#ced7e4"/><text x="741" y="807" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">root receives</text><text x="741" y="839" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(P−1)/P·S; each GPU</text><text x="741" y="871" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">sends S/P</text><rect x="1037" y="765" width="197" height="132" fill="none" stroke="#ced7e4"/><text x="1055" y="807" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">1</text><rect x="1234" y="765" width="366" height="132" fill="none" stroke="#ced7e4"/><text x="1252" y="807" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">incast: P−1 GPUs hit root</text><text x="1252" y="839" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">at the same time</text><rect x="0" y="897" width="1600" height="132" fill="#f7f9fc"/><rect x="0" y="897" width="147" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="939" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49"></text><rect x="147" y="897" width="203" height="132" fill="none" stroke="#ced7e4"/><text x="165" y="939" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Reduce</text><rect x="350" y="897" width="373" height="132" fill="none" stroke="#ced7e4"/><text x="368" y="939" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Each GPU&#x27;s data is</text><text x="368" y="971" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">collected and reduced at</text><text x="368" y="1003" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">root</text><rect x="723" y="897" width="314" height="132" fill="none" stroke="#ced7e4"/><text x="741" y="939" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">each GPU sends ≈S</text><rect x="1037" y="897" width="197" height="132" fill="none" stroke="#ced7e4"/><text x="1055" y="939" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">log₂P (tree)</text><rect x="1234" y="897" width="366" height="132" fill="none" stroke="#ced7e4"/><text x="1252" y="939" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">The reduction compute is</text><text x="1252" y="971" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">concentrated at root</text></svg>