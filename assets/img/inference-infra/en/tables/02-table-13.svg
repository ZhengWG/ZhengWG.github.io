<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="338" viewBox="0 0 1600 338"><rect width="1600" height="338" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="459" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Mechanism</text><rect x="459" y="1" width="657" height="68" fill="none" stroke="#ced7e4"/><text x="477" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">What overlaps</text><rect x="1116" y="1" width="484" height="68" fill="none" stroke="#ced7e4"/><text x="1134" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Unit of work</text><rect x="0" y="69" width="1600" height="100" fill="#ffffff"/><rect x="0" y="69" width="459" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">PP micro-batch pipelining</text><rect x="459" y="69" width="657" height="100" fill="none" stroke="#ced7e4"/><text x="477" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">different request groups on different stages</text><rect x="1116" y="69" width="484" height="100" fill="none" stroke="#ced7e4"/><text x="1134" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">one target forward pass + one</text><text x="1134" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">sampled token</text><rect x="0" y="169" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="169" width="459" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">overlap scheduler</text><rect x="459" y="169" width="657" height="100" fill="none" stroke="#ced7e4"/><text x="477" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">CPU post-processing of batch N with the GPU work</text><text x="477" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">of batch N+1</text><rect x="1116" y="169" width="484" height="100" fill="none" stroke="#ced7e4"/><text x="1134" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">one run_batch</text><rect x="0" y="269" width="1600" height="68" fill="#ffffff"/><rect x="0" y="269" width="459" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Two-batch overlap (TBO)</text><rect x="459" y="269" width="657" height="68" fill="none" stroke="#ced7e4"/><text x="477" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">two micro-batches within the same forward pass</text><rect x="1116" y="269" width="484" height="68" fill="none" stroke="#ced7e4"/><text x="1134" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">unrelated to PP</text></svg>