<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="822" viewBox="0 0 1600 822"><rect width="1600" height="822" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="427" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Shape (example)</text><rect x="427" y="1" width="463" height="68" fill="none" stroke="#ced7e4"/><text x="445" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Typical scenario</text><rect x="890" y="1" width="710" height="68" fill="none" stroke="#ced7e4"/><text x="908" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Optimization techniques</text><rect x="0" y="69" width="1600" height="196" fill="#ffffff"/><rect x="0" y="69" width="427" height="196" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Square [4096,7168]×[7168,2048]</text><rect x="427" y="69" width="463" height="196" fill="none" stroke="#ced7e4"/><text x="445" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Prefill projection layers,</text><text x="445" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">training</text><rect x="890" y="69" width="710" height="196" fill="none" stroke="#ced7e4"/><text x="908" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">① Compute at lower precision to raise F (FP8/FP4) ②</text><text x="908" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Tiling + double-buffered pipelining to hide memory</text><text x="908" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">traffic ③ Tune tile size / striped scheduling to</text><text x="908" y="207" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">avoid idle tail waves (wave quantization) ❌ Weight</text><text x="908" y="239" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">quantization</text><rect x="0" y="265" width="1600" height="196" fill="#f7f9fc"/><rect x="0" y="265" width="427" height="196" fill="none" stroke="#ced7e4"/><text x="18" y="307" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Tall-skinny</text><text x="18" y="339" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">[8,7168]×[7168,2048]</text><rect x="427" y="265" width="463" height="196" fill="none" stroke="#ced7e4"/><text x="445" y="307" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Decode weight GEMM (M=batch),</text><text x="445" y="339" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">lm_head</text><rect x="890" y="265" width="710" height="196" fill="none" stroke="#ced7e4"/><text x="908" y="307" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">① Batch up to M* (throughput is free until then) ②</text><text x="908" y="339" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Weight quantization to lower bpp (W4/W8) ③ Mark</text><text x="908" y="371" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">weight reads as &quot;evict after use&quot; so streaming data</text><text x="908" y="403" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">does not pollute L2 ❌ Splitting N/K (not in I),</text><text x="908" y="435" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">raising F, chasing MFU</text><rect x="0" y="461" width="1600" height="164" fill="#ffffff"/><rect x="0" y="461" width="427" height="164" fill="none" stroke="#ced7e4"/><text x="18" y="503" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Flat (thin K)</text><text x="18" y="535" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">[4096,32]×[32,4096]</text><rect x="427" y="461" width="463" height="164" fill="none" stroke="#ced7e4"/><text x="445" y="503" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">QKᵀ of unfused attention (K=h_d,</text><text x="445" y="535" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">output s×s)</text><rect x="890" y="461" width="710" height="164" fill="none" stroke="#ced7e4"/><text x="908" y="503" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">① Fuse into FlashAttention: the output stays in</text><text x="908" y="535" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">registers and the kernel disappears entirely ② If it</text><text x="908" y="567" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">cannot be eliminated, lower bpp ❌ Batching,</text><text x="908" y="599" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">enlarging K (locked by SMEM capacity)</text><rect x="0" y="625" width="1600" height="196" fill="#f7f9fc"/><rect x="0" y="625" width="427" height="196" fill="none" stroke="#ced7e4"/><text x="18" y="667" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Both small [8,16]×[16,7168]</text><rect x="427" y="625" width="463" height="196" fill="none" stroke="#ced7e4"/><text x="445" y="667" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">LoRA decode, small-rank adapters</text><rect x="890" y="625" width="710" height="196" fill="none" stroke="#ced7e4"/><text x="908" y="667" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">① Merge weights offline (W′=W+BA) so the kernel</text><text x="908" y="699" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">disappears ② Grouped batching across multiple</text><text x="908" y="731" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">adapters ③ Use CUDA Graph to absorb launch overhead</text><text x="908" y="763" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">⚠️ Batching is possible but don&#x27;t count on it;</text><text x="908" y="795" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">in-kernel optimization is pointless</text></svg>