<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="762" viewBox="0 0 1600 762"><rect width="1600" height="762" fill="#ffffff"/><rect x="0" y="1" width="1600" height="100" fill="#eaf0f9"/><rect x="0" y="1" width="204" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Structure</text><rect x="204" y="1" width="458" height="100" fill="none" stroke="#ced7e4"/><text x="222" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">KV/token (uniform L=61, h_d=128)</text><rect x="662" y="1" width="227" height="100" fill="none" stroke="#ced7e4"/><text x="680" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Read per decode</text><text x="680" y="75" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">step (s=32K)</text><rect x="889" y="1" width="284" height="100" fill="none" stroke="#ced7e4"/><text x="907" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">prefill FLOPs</text><rect x="1173" y="1" width="427" height="100" fill="none" stroke="#ced7e4"/><text x="1191" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">TP splittability</text><rect x="0" y="101" width="1600" height="68" fill="#ffffff"/><rect x="0" y="101" width="204" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">MHA (n_h=64)</text><rect x="204" y="101" width="458" height="68" fill="none" stroke="#ced7e4"/><text x="222" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">2·L·64·h_d·2B ≈ 1.9 MB</text><rect x="662" y="101" width="227" height="68" fill="none" stroke="#ced7e4"/><text x="680" y="143" font-size="24" font-family="Arial, H