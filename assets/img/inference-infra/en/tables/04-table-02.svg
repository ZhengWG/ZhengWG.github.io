ns-serif" font-weight="400" fill="#172d49">L·(512+64)·2B ≈ 70 KB (K/V share</text><text x="222" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the latent, so no factor of 2)</text><rect x="662" y="237" width="227" height="164" fill="none" stroke="#ced7e4"/><text x="680" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">2.3 GB</text><rect x="889" y="237" width="284" height="164" fill="none" stroke="#ced7e4"/><text x="907" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">O(s²) decode needs</text><text x="907" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">matrix absorption</text><rect x="1173" y="237" width="427" height="164" fill="none" stroke="#ced7e4"/><text x="1191" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">❌ the latent is shared by all</text><text x="1191" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">heads and can only be</text><text x="1191" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">replicated → attention must</text><text x="1191" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">use DP</text><rect x="0" y="401" width="1600" height="196" fill="#f7f9fc"/><rect x="0" y="401" width="204" height="196" fill="none" stroke="#ced7e4"/><text x="18" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">GDN (linear)</text><rect x="204" y="401" width="458" height="196" fill="none" stroke="#ced7e4"/><text x="222" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">0; fixed-size state ~94</text><text x="222" y="475" font-size="24" font-family="Arial, Helvetica, sans-serif" 