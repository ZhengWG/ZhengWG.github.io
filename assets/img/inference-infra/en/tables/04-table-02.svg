Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(CSA+HCA)</text><rect x="204" y="597" width="458" height="164" fill="none" stroke="#ced7e4"/><text x="222" y="639" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">~10 KB ⚠️ estimate (alternating</text><text x="222" y="671" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">CSA 4:1 + HCA 128:1, plus indexer</text><text x="222" y="703" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">KV; mixed precision: RoPE dims in</text><text x="222" y="735" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">BF16, the rest in FP8)</text><rect x="662" y="597" width="227" height="164" fill="none" stroke="#ced7e4"/><text x="680" y="639" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">~0.33 GB</text><rect x="889" y="597" width="284" height="164" fill="none" stroke="#ced7e4"/><text x="907" y="639" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">CSA O(s·k) k=1024 /</text><text x="907" y="671" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">HCA O((s/128)²)</text><text x="907" y="703" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">coefficient ÷16384</text><rect x="1173" y="597" width="427" height="164" fill="none" stroke="#ced7e4"/><text x="1191" y="639" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">same as the MLA family, must</text><text x="1191" y="671" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">use DP</text></svg>