<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="598" viewBox="0 0 1600 598"><rect width="1600" height="598" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="360" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Scenario</text><rect x="360" y="1" width="560" height="68" fill="none" stroke="#ced7e4"/><text x="378" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Scheme</text><rect x="920" y="1" width="680" height="68" fill="none" stroke="#ced7e4"/><text x="938" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Key points</text><rect x="0" y="69" width="1600" height="100" fill="#ffffff"/><rect x="0" y="69" width="360" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">TP_p = TP_d (homogeneous)</text><rect x="360" y="69" width="560" height="100" fill="none" stroke="#ced7e4"/><text x="378" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">direct rank-i → rank-i transfer</text><rect x="920" y="69" width="680" height="100" fill="none" stroke="#ced7e4"/><text x="938" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">layouts align, and SGLang bypasses staging</text><text x="938" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">automatically</text><rect x="0" y="169" width="1600" height="164" fill="#f7f9fc"/><rect x="0" y="169" width="360" height="164" fill="none" stroke="#ced7e4"/><text x="18" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">TP_p ≠ TP_d</text><text x="18" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">(heterogeneous)</text><rect x="360" y="169" width="560" height="164" fill="none" stroke="#ced7e4"/><text x="378" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">per-worker gather+permute → staging</text><text x="378" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">buffer → bulk RDMA → scatter on the peer</text><rect x="920" y="169" width="680" height="164" fill="none" stroke="#ced7e4"/><text x="938" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the head dimension is merged/split by a routing</text><text x="938" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">table; the token dimension removes block</text><text x="938" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">fragmentation; 2-5× faster than per-token slices;</text><text x="938" y="307" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">never centralize on rank0 (that uses only 1 NIC)</text><rect x="0" y="333" width="1600" height="132" fill="#ffffff"/><rect x="0" y="333" width="360" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">MLA</text><rect x="360" y="333" width="560" height="132" fill="none" stroke="#ced7e4"/><text x="378" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">direct transfer, no staging</text><rect x="920" y="333" width="680" height="132" fill="none" stroke="#ced7e4"/><text x="938" y="375" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the latent is shared by all heads, so the head</text><text x="938" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">dimension is immune (token-dimension fragmentation</text><text x="938" y="439" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">remains)</text><rect x="0" y="465" width="1600" height="132" fill="#f7f9fc"/><rect x="0" y="465" width="360" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Destination blocks in</text><text x="18" y="539" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">place</text><rect x="360" y="465" width="560" height="132" fill="none" stroke="#ced7e4"/><text x="378" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">D preallocates the block_table and</text><text x="378" y="539" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">preregisters the pool, and P lands data</text><text x="378" y="571" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">directly with RDMA writes at offsets</text><rect x="920" y="465" width="680" height="132" fill="none" stroke="#ced7e4"/><text x="938" y="507" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">multiple P ranks write concurrently to different</text><text x="938" y="539" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">offsets of the same D buffer → the concat is</text><text x="938" y="571" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">eliminated</text></svg>