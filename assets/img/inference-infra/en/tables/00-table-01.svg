<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="702" viewBox="0 0 1600 702"><rect width="1600" height="702" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="223" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Symbol</text><rect x="223" y="1" width="461" height="68" fill="none" stroke="#ced7e4"/><text x="241" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Definition</text><rect x="684" y="1" width="238" height="68" fill="none" stroke="#ced7e4"/><text x="702" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Unit</text><rect x="922" y="1" width="678" height="68" fill="none" stroke="#ced7e4"/><text x="940" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Key point</text><rect x="0" y="69" width="1600" height="132" fill="#ffffff"/><rect x="0" y="69" width="223" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">W</text><rect x="223" y="69" width="461" height="132" fill="none" stroke="#ced7e4"/><text x="241" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Number of floating-point</text><text x="241" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">operations (a multiply-add counts</text><text x="241" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">as 2)</text><rect x="684" y="69" width="238" height="132" fill="none" stroke="#ced7e4"/><text x="702" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">FLOP</text><rect x="922" y="69" width="678" height="132" fill="none" stroke="#ced7e4"/><text x="940" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">An algorithmic quantity; basically fixed</text><rect x="0" y="201" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="201" width="223" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Q</text><rect x="223" y="201" width="461" height="100" fill="none" stroke="#ced7e4"/><text x="241" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Actual bytes moved to and from</text><text x="241" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">HBM</text><rect x="684" y="201" width="238" height="100" fill="none" stroke="#ced7e4"/><text x="702" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Byte</text><rect x="922" y="201" width="678" height="100" fill="none" stroke="#ced7e4"/><text x="940" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">An implementation quantity, not the algorithm&#x27;s</text><text x="940" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">data volume; changes with tiling/fusion</text><rect x="0" y="301" width="1600" height="68" fill="#ffffff"/><rect x="0" y="301" width="223" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">F</text><rect x="223" y="301" width="461" height="68" fill="none" stroke="#ced7e4"/><text x="241" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Peak compute throughput</text><rect x="684" y="301" width="238" height="68" fill="none" stroke="#ced7e4"/><text x="702" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">FLOP/s</text><rect x="922" y="301" width="678" height="68" fill="none" stroke="#ced7e4"/><text x="940" y="343" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Rated hardware value; depends on numeric precision</text><rect x="0" y="369" width="1600" height="132" fill="#f7f9fc"/><rect x="0" y="369" width="223" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="411" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">BW</text><rect x="223" y="369" width="461" height="132" fill="none" stroke="#ced7e4"/><text x="241" y="411" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">GPU memory bandwidth</text><rect x="684" y="369" width="238" height="132" fill="none" stroke="#ced7e4"/><text x="702" y="411" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Byte/s</text><rect x="922" y="369" width="678" height="132" fill="none" stroke="#ced7e4"/><text x="940" y="411" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Models should distinguish rated bandwidth from</text><text x="940" y="443" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">effective bandwidth; e.g. the measured 3.33 TB/s</text><text x="940" y="475" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">is about 83–85% of the corresponding rated value</text><rect x="0" y="501" width="1600" height="100" fill="#ffffff"/><rect x="0" y="501" width="223" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="543" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">I = W/Q</text><rect x="223" y="501" width="461" height="100" fill="none" stroke="#ced7e4"/><text x="241" y="543" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Arithmetic intensity</text><rect x="684" y="501" width="238" height="100" fill="none" stroke="#ced7e4"/><text x="702" y="543" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">FLOP/Byte</text><rect x="922" y="501" width="678" height="100" fill="none" stroke="#ced7e4"/><text x="940" y="543" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">A workload property; contains no time; depends on</text><text x="940" y="575" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the kernel implementation</text><rect x="0" y="601" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="601" width="223" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="643" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">R = F/BW</text><rect x="223" y="601" width="461" height="100" fill="none" stroke="#ced7e4"/><text x="241" y="643" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Ridge point</text><rect x="684" y="601" width="238" height="100" fill="none" stroke="#ced7e4"/><text x="702" y="643" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">FLOP/Byte</text><rect x="922" y="601" width="678" height="100" fill="none" stroke="#ced7e4"/><text x="940" y="643" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">A hardware property; the ratio of two rates, so</text><text x="940" y="675" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">time cancels out</text></svg>