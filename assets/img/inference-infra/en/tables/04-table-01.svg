<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="662" viewBox="0 0 1600 662"><rect width="1600" height="662" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="241" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Model</text><rect x="241" y="1" width="418" height="68" fill="none" stroke="#ced7e4"/><text x="259" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Size or configuration</text><rect x="659" y="1" width="372" height="68" fill="none" stroke="#ced7e4"/><text x="677" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Attention / state</text><rect x="1031" y="1" width="569" height="68" fill="none" stroke="#ced7e4"/><text x="1049" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Impact on deployment</text><rect x="0" y="69" width="1600" height="132" fill="#ffffff"/><rect x="0" y="69" width="241" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Qwen3.5-397B-A17</text><text x="18" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">B</text><rect x="241" y="69" width="418" height="132" fill="none" stroke="#ced7e4"/><text x="259" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">397B total parameters, 17B</text><text x="259" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">active; 60 layers, d=4096</text><rect x="659" y="69" width="372" height="132" fill="none" stroke="#ced7e4"/><text x="677" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">45 GDN layers + 15</text><text x="677" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">full-attention layers</text><rect x="1031" y="69" width="569" height="132" fill="none" stroke="#ced7e4"/><text x="1049" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">two budgets, for fixed-size state and for</text><text x="1049" y="143" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">KV; natively multimodal, so the encoder</text><text x="1049" y="175" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">stage is budgeted separately</text><rect x="0" y="201" width="1600" height="164" fill="#f7f9fc"/><rect x="0" y="201" width="241" height="164" fill="none" stroke="#ced7e4"/><text x="18" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">DeepSeek-V4-Pro</text><rect x="241" y="201" width="418" height="164" fill="none" stroke="#ced7e4"/><text x="259" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">1.6T total parameters, 49B</text><text x="259" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">active</text><rect x="659" y="201" width="372" height="164" fill="none" stroke="#ced7e4"/><text x="677" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">CSA/HCA hybrid compressed</text><text x="677" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">attention</text><rect x="1031" y="201" width="569" height="164" fill="none" stroke="#ced7e4"/><text x="1049" y="243" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">compression granularity, tail state, and</text><text x="1049" y="275" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the indexer all enter the cache/transfer</text><text x="1049" y="307" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">layout; long-context cost drops, but it</text><text x="1049" y="339" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">is not independent of length</text><rect x="0" y="365" width="1600" height="164" fill="#ffffff"/><rect x="0" y="365" width="241" height="164" fill="none" stroke="#ced7e4"/><text x="18" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Kimi K2.6</text><rect x="241" y="365" width="418" height="164" fill="none" stroke="#ced7e4"/><text x="259" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">1T total parameters, 32B</text><text x="259" y="439" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">active; 384 experts, top-8</text><rect x="659" y="365" width="372" height="164" fill="none" stroke="#ced7e4"/><text x="677" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">MLA, MoonViT 400M</text><rect x="1031" y="365" width="569" height="164" fill="none" stroke="#ced7e4"/><text x="1049" y="407" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">latent sharing is decoupled from</text><text x="1049" y="439" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">multimodal encoding; evaluate INT4 weight</text><text x="1049" y="471" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">capacity and actual kernel throughput</text><text x="1049" y="503" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">separately</text><rect x="0" y="529" width="1600" height="132" fill="#f7f9fc"/><rect x="0" y="529" width="241" height="132" fill="none" stroke="#ced7e4"/><text x="18" y="571" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">GLM-5.1 config</text><rect x="241" y="529" width="418" height="132" fill="none" stroke="#ced7e4"/><text x="259" y="571" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">78 layers, d=6144; 256 routed</text><text x="259" y="603" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">+ 1 shared, top-8</text><rect x="659" y="529" width="372" height="132" fill="none" stroke="#ced7e4"/><text x="677" y="571" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">glm_moe_dsa , latent 512,</text><text x="677" y="603" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">RoPE 64, index top-2048</text><rect x="1031" y="529" width="569" height="132" fill="none" stroke="#ced7e4"/><text x="1049" y="571" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">plan for MLA+DSA; do not carry over the</text><text x="1049" y="603" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">earlier draft&#x27;s conflicting claim about</text><text x="1049" y="635" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">GDN</text></svg>