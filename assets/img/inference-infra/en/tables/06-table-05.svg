<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="438" viewBox="0 0 1600 438"><rect width="1600" height="438" fill="#ffffff"/><rect x="0" y="1" width="1600" height="68" fill="#eaf0f9"/><rect x="0" y="1" width="497" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Object</text><rect x="497" y="1" width="1103" height="68" fill="none" stroke="#ced7e4"/><text x="515" y="43" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#172d49">Allocation and reuse principle</text><rect x="0" y="69" width="1600" height="68" fill="#ffffff"/><rect x="0" y="69" width="497" height="68" fill="none" stroke="#ced7e4"/><text x="18" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">Standard KV</text><rect x="497" y="69" width="1103" height="68" fill="none" stroke="#ced7e4"/><text x="515" y="111" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">paged block management; prefixes are reused by token/position and model version</text><rect x="0" y="137" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="137" width="497" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="179" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">GDN recurrent state</text><rect x="497" y="137" width="1103" height="100" fill="none" stroke="#ced7e4"/><text x="515" y="179" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">only saved prefix checkpoints can be restored; an arbitrary historical state cannot</text><text x="515" y="211" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">be truncated out of the final state</text><rect x="0" y="237" width="1600" height="100" fill="#ffffff"/><rect x="0" y="237" width="497" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">CSA/HCA compressed KV</text><rect x="497" y="237" width="1103" height="100" fill="none" stroke="#ced7e4"/><text x="515" y="279" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">record both the completed compressed blocks and the incomplete tail, and preserve</text><text x="515" y="311" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">the compression boundary at handoff</text><rect x="0" y="337" width="1600" height="100" fill="#f7f9fc"/><rect x="0" y="337" width="497" height="100" fill="none" stroke="#ced7e4"/><text x="18" y="379" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">SWA / indexer</text><rect x="497" y="337" width="1103" height="100" fill="none" stroke="#ced7e4"/><text x="515" y="379" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">maintain the sliding-window lifetime and the index data separately; moving only the</text><text x="515" y="411" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#172d49">latent does not make the state complete</text></svg>