<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img"><title>Public topology example: 8 GPUs, 4 bonded NICs, and two NUMA domains</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#52657b" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="42" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#172b45" text-anchor="start" font-weight="700">Public topology example: 8 GPUs, 4 bonded NICs, and two NUMA domains</text><text x="36" y="82" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#52657b" text-anchor="start">Solid lines: shared PCIe switches. Dashed lines: topological distance, not physical cables.</text><rect x="40" y="110" width="620" height="550" rx="9" fill="#f7f9fc" stroke="#d5dfe9"/><text x="350" y="146" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#172b45" text-anchor="middle" font-weight="700">NUMA 0 · GPU0–3 / NIC0–1</text><rect x="110" y="175" width="180" height="50" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="200.0" y="206.3" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="middle">GPU0</text><rect x="400" y="175" width="180" height="50" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="490.0" y="206.3" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="middle">GPU2</text><rect x="85" y="265" width="240" height="290" rx="9" fill="#ffffff" stroke="#246bc5"/><text x="205" y="293" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="middle" font-weight="700">PIX domain A</text><rect x="120" y="315" width="170" height="45" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="205.0" y="343.5" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="middle">GPU1</text><rect x="120" y="390" width="170" height="45" rx="9" fill="#edf0f4" stroke="#d5dfe9"/><text x="205.0" y="418.5" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="middle">PCIe switch</text><rect x="102" y="470" width="206" height="50" rx="9" fill="#fff6dc" stroke="#d5dfe9"/><text x="205.0" y="500.7" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#172b45" text-anchor="middle">NIC0 · 400G bond</text><line x1="205" y1="360" x2="205" y2="390" stroke="#52657b" stroke-width="2"/><line x1="205" y1="435" x2="205" y2="470" stroke="#52657b" stroke-width="2"/><path d="M 200 225 V 245 H 70 V 495 H 102" fill="none" stroke="#705ac5" stroke-width="2" stroke-dasharray="7 5"/><text x="76" y="238" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#705ac5" text-anchor="start">NODE</text><rect x="375" y="265" width="240" height="290" rx="9" fill="#ffffff" stroke="#246bc5"/><text x="495" y="293" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="middle" font-weight="700">PIX domain B</text><rect x="410" y="315" width="170" height="45" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="495.0" y="343.5" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="middle">GPU3</text><rect x="410" y="390" width="170" height="45" rx="9" fill="#edf0f4" stroke="#d5dfe9"/><text x="495.0" y="418.5" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="middle">PCIe switch</text><rect x="392" y="470" width="206" height="50" rx="9" fill="#fff6dc" stroke="#d5dfe9"/><text x="495.0" y="500.7" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#172b45" text-anchor="middle">NIC1 · 400G bond</text><line x1="495" y1="360" x2="495" y2="390" stroke="#52657b" stroke-width="2"/><line x1="495" y1="435" x2="495" y2="470" stroke="#52657b" stroke-width="2"/><path d="M 490 225 V 245 H 630 V 495 H 598" fill="none" stroke="#705ac5" stroke-width="2" stroke-dasharray="7 5"/><text x="