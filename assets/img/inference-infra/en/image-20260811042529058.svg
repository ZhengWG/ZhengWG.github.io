<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img"><title>Hierarchical communication: reduce locally before crossing nodes</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#52657b" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="42" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#172b45" text-anchor="start" font-weight="700">Hierarchical communication: reduce locally before crossing nodes</text><text x="36" y="90" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#172b45" text-anchor="start" font-weight="700">Flat ring: 8 GPUs, 2 cross-node links in the logical ring</text><rect x="120" y="120" width="62" height="44" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="151.0" y="147.4" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="middle">0</text><rect x="730" y="120" width="62" height="44" rx="9" fill="#faede4" stroke="#d5dfe9"/><text x="761.0" y="147.4" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="middle">4</text><rect x="190" y="120" width="62" height="44" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="221.0" y="147.4" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="middle">1</text><rect x="800" y="120" width="62" height="44" rx="9" fill="#faede4" stroke="#d5dfe9"/><text x="831.0" y="147.4" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="middle">5</text><rect x="260" y="120" width="62" height="44" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="291.0" y="147.4" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="middle">2</text><rect x="870" y="120" width="62" height="44" rx="9" fill="#faede4" stroke="#d5dfe9"/><text x="901.0" y="147.4" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="middle">6</text><rect x="330" y="120" width="62" height="44" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="361.0" y="147.4" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="middle">3</text><rect x="940" y="120" width="62" height="44" rx="9" fill="#faede4" stroke="#d5dfe9"/><text x="971.0" y="147.4" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="middle">7</text><line x1="415" y1="142" x2="720" y2="142" stroke="#c75a24" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1010 164 C 1080 240 100 240 120 164" fill="none" stroke="#c75a24" stroke-width="3" marker-end="url(#arrow)"/><text x="265" y="194" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#172b45" text-anchor="middle">Node A (4 GPUs)</text><text x="870" y="194" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#172b45" text-anchor="middle">Node B (4 GPUs)</text><text x="36" y="270" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#172b45" text-anchor="start">14 ring steps traverse a cross-node link; only one NIC is used.</text><text x="36" y="302" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#52657b" text-anchor="start">Example: 20 GB/s becomes the ring bottleneck; cross-node α = 15 µs is paid 14 times.</text><line x1="36" y1="329" x2="1164" y2="329" stroke="#d5dfe9" stroke-width="2"/><text x="36" y="372" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#172b45" text-anchor="start" font-weight="700">Three stages use the best resource for each transfer</text><text x="36" y="421" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="start" font-weight="700">1. Intra-node ReduceScatter over NVLink / HCCS</text><rect x="120" y="444" width="62" height="40" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="151.0" y="469.1" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="middle">0</text><rect x="730" y="444" width="62" height="40" rx="9" fill="#faede4" stroke="#d5dfe9"/><text x="761.0" y="469.1" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="middle">4</text><rect x="190" y="444" width="62" height="40" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="221.0" y="469.1" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="middle">1</text><rect x="800" y="444" width="62" height="40" rx="9" fill="#faede4" stroke="#d5dfe9"/><text x="831.0" y="469.1" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="middle">5</text><rect x="260" y="444" width="62" height="40" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="291.0" y="469.1" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="middle">2</text><rect x="870" y="444" width="62" height="40" rx="9" fill="#faede4" stroke="#d5dfe9"/><text x="901.0" y="469.1" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="middle">6</text><rect x="330" y="444" width="62" height="40" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="361.0" y="469.1" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="middle">3</text><rect x="940" y="444" width="62" height="40" rx="9" fill="#faede4" stroke="#d5dfe9"/><text x="971.0" y="469.1" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="middle">7</text><text x="36" y="523" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#087f6a" text-anchor="start">Each GPU keeps only its 1/4 partial sum. Shrink the data on fast local links first.</text><text x="36" y="579" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="start" font-weight="700">2. Cross-node exchange: pair equal local ranks, use all four NICs</text><line x1="180" y1="610" x2="1000" y2="610" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><line x1="202" y1="635" x2="1022" y2="635" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><line x1="224" y1="660" x2="1044" y2="660" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><line x1="246" y1="685" x2="1066" y2="685" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="745" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#172b45" text-anchor="start">A0 ↔ B0, A1 ↔ B1, …; each pair exchanges 1/P of the data.</text><text x="36" y="778" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#087f6a" text-anchor="start">Cross-node volume: S → S/P. Cross-node parallelism: 1 → P.</text><text x="36" y="834" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="start" font-weight="700">3. Intra-node AllGather reconstructs the full result</text><rect x="36" y="869" width="1128" height="80" rx="9" fill="#e4f4ee" stroke="#d5dfe9"/><text x="600.0" y="901.0" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="middle">Example benefit: 8–10× faster</text><text x="600.0" y="929.0" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="middle">Less cross-node data; more parallel NICs; 14 → 1–2 cross-node steps.</text><text x="36" y="988" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#172b45" text-anchor="start" font-weight="700">Order matters: reduce on cheap links, then move only 1/P over expensive links.</text></svg>