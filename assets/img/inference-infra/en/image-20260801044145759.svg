<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="890" viewBox="0 0 1260 890" role="img"><title>Memory hierarchy: capacity, bandwidth, and optimization levers</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#52657b" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="42" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#172b45" text-anchor="start" font-weight="700">Memory hierarchy: capacity, bandwidth, and optimization levers</text><rect x="50" y="120" width="760" height="112" rx="9" fill="#eef0f3" stroke="#d5dfe9"/><text x="70" y="159" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="start" font-weight="700">Host DRAM · TB-scale</text><text x="70" y="197" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="start">PCIe 5 ×16: 64 GB/s; pinned ~25 GB/s measured; pageable ~6</text><text x="845" y="160" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#52657b" text-anchor="start">KV offload / HiCache L2</text><text x="845" y="192" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#52657b" text-anchor="start">Page-first access; zero-copy</text><rect x="85" y="265" width="700" height="112" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="105" y="304" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="start" font-weight="700">HBM3 · 96 GB · 4.0 TB/s</text><text x="105" y="342" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="start">Weights + KV pool; sets the decode lower bound</text><text x="845" y="305" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#52657b" text-anchor="start">Quantization / EP / batching</text><text x="845" y="337" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#52657b" text-anchor="start">Raise arithmetic intensity</text><rect x="120" y="410" width="640" height="112" rx="9" fill="#e4f4ee" stroke="#d5dfe9"/><text x="140" y="449" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="start" font-weight="700">L2 · 60 MB · ~8–10 TB/s (shared across SMs)</text><text x="140" y="487" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="start">Resident weight tile (0.92 MB): larger BM can avoid rereads</text><text x="845" y="450" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#52657b" text-anchor="start">Tile reuse / persistent kernels</text><text x="845" y="482" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#52657b" text-anchor="start">Source of reuse across tiles</text><rect x="155" y="555" width="580" height="112" rx="9" fill="#faede4" stroke="#d5dfe9"/><text x="175" y="594" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="start" font-weight="700">SMEM / L1 · 228 KB per SM · ~30+ TB/s</text><text x="175" y="632" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="start">Tiled FlashAttention intermediates live at this level</text><text x="845" y="595" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#52657b" text-anchor="start">Fusion / tiling</text><text x="845" y="627" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#52657b" text-anchor="start">TMA double buffering</text><rect x="190" y="700" width="520" height="112" rx="9" fill="#fbe7e8" stroke="#d5dfe9"/><text x="210" y="739" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="start" font-weight="700">Registers · 256 KB per SM · ~100s TB/s</text><text x="210" y="777" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="start">WGMMA accumulators; FP32 reduction accumulators</text></svg>