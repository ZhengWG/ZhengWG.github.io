<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img"><title>One HBM stack: DRAM dies, a logic base die, and a wide interface</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#52657b" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="42" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#172b45" text-anchor="start" font-weight="700">One HBM stack: DRAM dies, a logic base die, and a wide interface</text><rect x="60" y="100" width="300" height="35" rx="9" fill="#e9edf1" stroke="#d5dfe9"/><rect x="60" y="145" width="300" height="35" rx="9" fill="#e9edf1" stroke="#d5dfe9"/><rect x="60" y="190" width="300" height="35" rx="9" fill="#e9edf1" stroke="#d5dfe9"/><rect x="60" y="235" width="300" height="35" rx="9" fill="#e9edf1" stroke="#d5dfe9"/><text x="400" y="151" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#172b45" text-anchor="start" font-weight="700">8–12 vertically stacked DRAM dies</text><text x="400" y="188" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#52657b" text-anchor="start">Die count determines capacity per stack.</text><rect x="60" y="295" width="300" height="40" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="400" y="323" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="start">Logic base die + vertical TSV interconnects</text><rect x="60" y="350" width="300" height="60" rx="9" fill="#e4f4ee" stroke="#d5dfe9"/><text x="210.0" y="386.3" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="middle">1024-bit interface</text><text x="400" y="382" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="start">Fixed 1024-bit interface; 2048 bits starting with HBM4.</text></svg>