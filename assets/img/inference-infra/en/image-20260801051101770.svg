<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img"><title>GPU and NPU: compute units and on-chip memory</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#52657b" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="42" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#172b45" text-anchor="start" font-weight="700">GPU and NPU: compute units and on-chip memory</text><text x="300" y="94" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#172b45" text-anchor="middle" font-weight="700">Ascend 910B · AI Core matrix path</text><text x="910" y="94" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#172b45" text-anchor="middle" font-weight="700">Hopper · SM</text><rect x="50" y="125" width="520" height="65" rx="9" fill="#edf4ff" stroke="#d5dfe9"/><text x="310.0" y="162.9" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="middle">HBM2e 1.6 TB/s → L2 192 MB</text><rect x="680" y="125" width="460" height="65" rx="9" fill="#edf4ff" stroke="#d5dfe9"/><text x="910.0" y="162.9" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="middle">HBM → L2 60 MB</text><line x1="310" y1="190" x2="310" y2="230" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><text x="330" y="218" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">MTE2</text><line x1="910" y1="190" x2="910" y2="230" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><text x="930" y="218" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">TMA</text><rect x="50" y="240" width="520" height="75" rx="9" fill="#e4f4ee" stroke="#d5dfe9"/><text x="310.0" y="284.1" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#172b45" text-anchor="middle">L1 Buffer · 1 MB</text><rect x="680" y="240" width="460" height="140" rx="9" fill="#e4f4ee" stroke="#d5dfe9"/><text x="910.0" y="287.3" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="middle">SMEM · 228 KB</text><text x="910.0" y="316.3" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="middle">A, B, and intermediate results</text><text x="910.0" y="345.3" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="middle">share one physical memory space</text><line x1="235" y1="315" x2="180" y2="365" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><line x1="385" y1="315" x2="440" y2="365" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><text x="142" y="347" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="start">A tile</text><text x="445" y="347" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#172b45" text-anchor="start">B tile</text><rect x="65" y="375" width="225" height="100" rx="9" fill="#e5effb" stroke="#d5dfe9"/><text x="177.5" y="416.8" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="middle">L0A · 64 KB</text><text x="177.5" y="445.8" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="middle">A operands only</text><rect x="335" y="375" width="225" height="100" rx="9" fill="#faede4" stroke="#d5dfe9"/><text x="447.5" y="416.8" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="middle">L0B · 64 KB</text><text x="447.5" y="445.8" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="middle">B operands only</text><line x1="180" y1="475" x2="260" y2="535" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><line x1="440" y1="475" x2="365" y2="535" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><rect x="115" y="54