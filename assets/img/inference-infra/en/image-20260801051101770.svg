"/><rect x="680" y="615" width="460" height="85" rx="9" fill="#faede4" stroke="#d5dfe9"/><text x="910.0" y="664.1" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#172b45" text-anchor="middle">CUDA cores (vector / scalar)</text><text x="680" y="785" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="start">Caches are managed by hardware.</text><text x="680" y="820" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#172b45" text-anchor="start">SMEM partitioning is chosen in software.</text></svg>