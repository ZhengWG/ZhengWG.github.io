<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img"><title>AllReduce algorithms: distance and communication rounds</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#52657b" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="42" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#172b45" text-anchor="start" font-weight="700">AllReduce algorithms: distance and communication rounds</text><circle cx="75" cy="130" r="8" fill="#52657b"/><circle cx="140" cy="130" r="8" fill="#52657b"/><circle cx="205" cy="130" r="8" fill="#52657b"/><circle cx="270" cy="130" r="8" fill="#52657b"/><circle cx="335" cy="130" r="8" fill="#52657b"/><circle cx="400" cy="130" r="8" fill="#52657b"/><circle cx="465" cy="130" r="8" fill="#52657b"/><circle cx="530" cy="130" r="8" fill="#52657b"/><path d="M 75 122 Q 107.5 79 140 122" fill="none" stroke="#c75a24" stroke-width="2"/><text x="610" y="110" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="start" font-weight="700">Ring</text><text x="610" y="140" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">Distance stays 1: move one position per step.</text><text x="610" y="166" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">P−1 = 7 steps for 8 GPUs.</text><circle cx="75" cy="240" r="8" fill="#52657b"/><circle cx="140" cy="240" r="8" fill="#52657b"/><circle cx="205" cy="240" r="8" fill="#52657b"/><circle cx="270" cy="240" r="8" fill="#52657b"/><circle cx="335" cy="240" r="8" fill="#52657b"/><circle cx="400" cy="240" r="8" fill="#52657b"/><circle cx="465" cy="240" r="8" fill="#52657b"/><circle cx="530" cy="240" r="8" fill="#52657b"/><path d="M 75 232 Q 107.5 189 140 232" fill="none" stroke="#705ac5" stroke-width="2"/><path d="M 75 232 Q 140.0 183 205 232" fill="none" stroke="#705ac5" stroke-width="2"/><path d="M 75 232 Q 205.0 171 335 232" fill="none" stroke="#705ac5" stroke-width="2"/><text x="610" y="220" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="start" font-weight="700">Recursive halving/doubling (HD)</text><text x="610" y="250" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">Distance doubles: 1 → 2 → 4.</text><text x="610" y="276" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">Coverage doubles: log₂8 = 3 steps per phase.</text><circle cx="75" cy="350" r="8" fill="#52657b"/><circle cx="140" cy="350" r="8" fill="#52657b"/><circle cx="205" cy="350" r="8" fill="#52657b"/><circle cx="270" cy="350" r="8" fill="#52657b"/><circle cx="335" cy="350" r="8" fill="#52657b"/><circle cx="400" cy="350" r="8" fill="#52657b"/><circle cx="465" cy="350" r="8" fill="#52657b"/><circle cx="530" cy="350" r="8" fill="#52657b"/><path d="M 75 342 Q 107.5 299 140 342" fill="none" stroke="#087f6a" stroke-width="2"/><path d="M 75 342 Q 140.0 293 205 342" fill="none" stroke="#087f6a" stroke-width="2"/><path d="M 75 342 Q 172.5 287 270 342" fill="none" stroke="#087f6a" stroke-width="2"/><path d="M 75 342 Q 205.0 281 335 342" fill="none" stroke="#087f6a" stroke-width="2"/><path d="M 75 342 Q 237.5 275 400 342" fill="none" stroke="#087f6a" stroke-width="2"/><path d="M 75 342 Q 270.0 269 465 342" fill="none" stroke="#087f6a" stroke-width="2"/><path d="M 75 342 Q 302.5 263 530 342" fill="none" stroke="#087f6a" stroke-width="2"/><text x="610" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#172b45" text-anchor="start" font-weight="700">One-shot / two-shot</text><text x="610" y="360" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">Direct communication with arbitrary GPUs.</text><text x="610" y="386" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#172b45" text-anchor="start">Constant number of rounds.</text></svg>