name: 'Refresh house price data'

on:
  schedule:
    - cron: '0 0 * * *'   # daily at 00:00 UTC = 08:00 Beijing
  workflow_dispatch:        # manual trigger from Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/house_price/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/house_price/requirements.txt

      - name: Test data parsers and freshness rules
        run: python -m unittest discover -s tools/house_price/tests -v

      - name: Snapshot current data
        run: cp assets/data/house_price/hz.json "$RUNNER_TEMP/hz.prev.json"

      - name: Export data
        working-directory: tools/house_price
        run: python export_data.py -o ../../assets/data/house_price -c hz --prev "$RUNNER_TEMP/hz.prev.json" --fang-pages 5

      # Fails on a broken export (absolute floors) *and* on a partial scrape
      # (any metric shrinking >10% vs. the committed data). Also reports whether
      # anything but `updated_at` actually changed.
      - name: Validate exported data
        id: validate
        run: |
          python tools/house_price/validate_export.py \
            --new assets/data/house_price/hz.json \
            --prev "$RUNNER_TEMP/hz.prev.json"

      - name: Restore original data on failure
        if: failure()
        run: |
          git checkout -- assets/data/house_price/
          echo "Restored original data after export/validation failure."

      # Most days the scrape produces byte-identical data and only the
      # `updated_at` stamp moves. Committing that would trigger a full site
      # rebuild + gh-pages force-push for no content change, so skip it.
      - name: Commit and push if changed
        if: success() && steps.validate.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/house_price/
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "chore: refresh house price data $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report no-op
        if: success() && steps.validate.outputs.changed != 'true'
        run: |
          echo "数据内容与采集状态未变化；仅检查时间变化，跳过数据提交。请同时查看上方采集降级警告。" \
            >> $GITHUB_STEP_SUMMARY
          git checkout -- assets/data/house_price/
