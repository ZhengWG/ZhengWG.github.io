name: 'Automatic build'
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  workflow_run:
    workflows:
      - "Refresh house price data"
    types:
      - completed
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: site-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  continuous-delivery:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for posts's lastmod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test browser scripts
        run: npm test

      - name: Test AI Infra report publication
        run: python3 -m unittest discover -s tools/ai_infra -p 'test_*.py' -v

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7
          bundler-cache: true

      - name: Check baseurl
        run: |
          baseurl="$(grep '^baseurl:' _config.yml | sed "s/.*: *//;s/['\"]//g;s/#.*//")"
          if [[ -n $baseurl ]]; then
            echo "BASE_URL=$baseurl" >> $GITHUB_ENV
          fi

      - name: Build Site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll b -d "_site$BASE_URL"

      - name: Test Site
        run: |
          python3 tools/check-site.py "_site$BASE_URL"
          bash tools/test.sh

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n $BASE_URL ]]; then
            mv _site$BASE_URL _site-rename
            rm -rf _site
            mv _site-rename _site
          fi

          bash tools/deploy.sh
