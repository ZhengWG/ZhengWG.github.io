---
layout: lab
---
<section data-native-collection data-type="categories" data-term="{{ page.title | escape }}">
  <div class="page-heading"><p class="eyebrow">CATEGORIES</p><h1>{{ page.title }}</h1></div>
  <div class="series-table">{% for post in page.posts %}<a href="{{ post.url | relative_url }}"><time>{{ post.date | date: '%Y-%m-%d' }}</time><h3>{{ post.title }}</h3><span>↗</span></a>{% endfor %}</div>
</section>
